name: Local safety checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Tool versions
        run: |
          python3 --version
          node --version
      - name: Install isolated checks
        run: |
          python3 -m venv .build/check-env
          .build/check-env/bin/python -m pip install -r requirements-dev.txt
      - name: Build frontend without network
        run: node scripts/build-web.cjs
      - name: Offline tests
        run: |
          python3 -m unittest discover -s tests -p 'test*.py'
          node --test tests/test-*.cjs
          python3 tests/http_smoke.py
          python3 scripts/check_repository.py
      - name: Lint types and security
        run: |
          .build/check-env/bin/ruff check .
          .build/check-env/bin/mypy
          .build/check-env/bin/bandit -r research local_security.py ibkr_paper_bridge.py -ll
          .build/check-env/bin/pip-audit --no-deps --disable-pip -r requirements.txt
