      function createEmptyEntry() {
        return {
          id: "",
          label: "",
          amount: "",
          category: "Costo Variabile",
          managementSource: "Manuale",
          currentValue: "",
          investmentType: "Liquidita'",
          investmentDetail: "",
          ticker: "",
          purchaseDate: new Date().toISOString().slice(0, 10),
          entryPrice: "",
          quantity: "",
          marketCurrency: "EUR",
          geography: "Globale",
          continent: "Globale"
        };
      }

      function App() {
        const [state, setState] = useState(loadState);
        const [isSalaryPanelOpen, setIsSalaryPanelOpen] = useState(() => localStorage.getItem("salary-estimate-panel-open") !== "false");
        const [isMonthlyInputOpen, setIsMonthlyInputOpen] = useState(() => localStorage.getItem("monthly-input-panel-open") !== "false");
        const [isMonthlyHistoryOpen, setIsMonthlyHistoryOpen] = useState(() => localStorage.getItem("monthly-history-panel-open") !== "false");
        const [isMonthlySummaryOpen, setIsMonthlySummaryOpen] = useState(() => localStorage.getItem("monthly-summary-panel-open") !== "false");
        const [isPortfolioPanelOpen, setIsPortfolioPanelOpen] = useState(() => localStorage.getItem("portfolio-panel-open") !== "false");
        const [entry, setEntry] = useState(createEmptyEntry);
        const [editingMonthId, setEditingMonthId] = useState("");
        const [persistenceStatus, setPersistenceStatus] = useState("loading");
        const persistenceReady = useRef(false);
        const ibkrPollers = useRef({});
        const [ibkrPaper, setIbkrPaper] = useState({ reachable: false, loading: true, data: null, error: "" });
        const [ibkrLive, setIbkrLive] = useState({ reachable: false, loading: true, data: null, error: "" });

        useEffect(() => {
          localStorage.setItem(storageKey, JSON.stringify(state));
        }, [state]);

        useEffect(() => {
          let cancelled = false;
          (async () => {
            try {
              const response = await fetch(`${ibkrBridgeBaseUrl}/api/state`, { cache: "no-store" });
              const document = await response.json().catch(() => ({}));
              if (!response.ok) throw new Error(document.error || "Memoria locale non disponibile");
              if (!cancelled && document.saved && document.state) {
                setState(normalizeStoredState(document.state));
                setEntry({ ...createEmptyEntry(), ...(document.entry || {}) });
                setEditingMonthId(String(document.editingMonthId || ""));
                const ui = document.ui || {};
                if (typeof ui.salaryPanelOpen === "boolean") setIsSalaryPanelOpen(ui.salaryPanelOpen);
                if (typeof ui.monthlyInputOpen === "boolean") setIsMonthlyInputOpen(ui.monthlyInputOpen);
                if (typeof ui.monthlyHistoryOpen === "boolean") setIsMonthlyHistoryOpen(ui.monthlyHistoryOpen);
                if (typeof ui.monthlySummaryOpen === "boolean") setIsMonthlySummaryOpen(ui.monthlySummaryOpen);
                if (typeof ui.portfolioPanelOpen === "boolean") setIsPortfolioPanelOpen(ui.portfolioPanelOpen);
              } else if (!cancelled) {
                const initialPayload = {
                  state: {
                    ...state,
                    budgetModelVersion: 4,
                    notes: (state.notes || []).map(normalizeNote),
                    monthlyHistory: recalibrateMonthlyHistory(state.monthlyHistory || [])
                  },
                  entry,
                  editingMonthId,
                  ui: {
                    salaryPanelOpen: isSalaryPanelOpen,
                    monthlyInputOpen: isMonthlyInputOpen,
                    monthlyHistoryOpen: isMonthlyHistoryOpen,
                    monthlySummaryOpen: isMonthlySummaryOpen,
                    portfolioPanelOpen: isPortfolioPanelOpen
                  }
                };
                const saveResponse = await fetch(`${ibkrBridgeBaseUrl}/api/state`, {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify(initialPayload)
                });
                if (!saveResponse.ok) throw new Error("Inizializzazione memoria non riuscita");
              }
              if (!cancelled) {
                persistenceReady.current = true;
                setPersistenceStatus("saved");
              }
            } catch {
              if (!cancelled) {
                persistenceReady.current = true;
                setPersistenceStatus("error");
              }
            }
          })();
          return () => { cancelled = true; };
        }, []);

        const persistencePayload = useMemo(() => ({
          state: {
            ...state,
            budgetModelVersion: 4,
            notes: (state.notes || []).map(normalizeNote),
            monthlyHistory: recalibrateMonthlyHistory(state.monthlyHistory || [])
          },
          entry,
          editingMonthId,
          ui: {
            salaryPanelOpen: isSalaryPanelOpen,
            monthlyInputOpen: isMonthlyInputOpen,
            monthlyHistoryOpen: isMonthlyHistoryOpen,
            monthlySummaryOpen: isMonthlySummaryOpen,
            portfolioPanelOpen: isPortfolioPanelOpen
          }
        }), [state, entry, editingMonthId, isSalaryPanelOpen, isMonthlyInputOpen, isMonthlyHistoryOpen, isMonthlySummaryOpen, isPortfolioPanelOpen]);

        useEffect(() => {
          if (!persistenceReady.current) return;
          setPersistenceStatus("saving");
          const timer = setTimeout(async () => {
            try {
              const response = await fetch(`${ibkrBridgeBaseUrl}/api/state`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(persistencePayload)
              });
              if (!response.ok) throw new Error("Salvataggio non riuscito");
              setPersistenceStatus("saved");
            } catch {
              setPersistenceStatus("error");
            }
          }, 350);
          return () => clearTimeout(timer);
        }, [persistencePayload]);

        useEffect(() => {
          const flushState = () => {
            if (!persistenceReady.current) return;
            navigator.sendBeacon(
              `${ibkrBridgeBaseUrl}/api/state`,
              new Blob([JSON.stringify(persistencePayload)], { type: "application/json" })
            );
          };
          const flushWhenHidden = () => {
            if (document.visibilityState === "hidden") flushState();
          };
          window.addEventListener("pagehide", flushState);
          document.addEventListener("visibilitychange", flushWhenHidden);
          return () => {
            window.removeEventListener("pagehide", flushState);
            document.removeEventListener("visibilitychange", flushWhenHidden);
          };
        }, [persistencePayload]);

        useEffect(() => {
          localStorage.setItem("salary-estimate-panel-open", String(isSalaryPanelOpen));
        }, [isSalaryPanelOpen]);

        useEffect(() => {
          localStorage.setItem("monthly-input-panel-open", String(isMonthlyInputOpen));
        }, [isMonthlyInputOpen]);

        useEffect(() => {
          localStorage.setItem("monthly-history-panel-open", String(isMonthlyHistoryOpen));
        }, [isMonthlyHistoryOpen]);

        useEffect(() => {
          localStorage.setItem("monthly-summary-panel-open", String(isMonthlySummaryOpen));
        }, [isMonthlySummaryOpen]);

        useEffect(() => {
          localStorage.setItem("portfolio-panel-open", String(isPortfolioPanelOpen));
        }, [isPortfolioPanelOpen]);

        useEffect(() => {
          const pollers = {
            paper: createIbkrPoller({ baseUrl: ibkrBridgeBaseUrl, mode: "paper", onState: setIbkrPaper }),
            live: createIbkrPoller({ baseUrl: ibkrBridgeBaseUrl, mode: "live", onState: setIbkrLive })
          };
          ibkrPollers.current = pollers;
          Object.values(pollers).forEach(poller => poller.refresh());
          return () => Object.values(pollers).forEach(poller => poller.stop());
        }, []);

        function refreshIbkr(mode) {
          return ibkrPollers.current[mode]?.refresh();
        }

        const totals = useMemo(() => {
          const baseIncome = Number(state.income) || 0;
          const isDecember = String(state.monthName).toLowerCase() === "dicembre";
          const decemberBonusNet = isDecember ? Math.min(2000, Math.max(0, Number(state.decemberBonusNet) || 0)) : 0;
          const income = baseIncome + decemberBonusNet;
          const noteTotals = summarizeNotes(state.notes);
          const fixedCosts = Math.max(0, Number(state.fixedCosts) || 0);
          const variableCosts = Math.max(0, Number(state.variableCosts) || 0);
          const fixedCostDetailGap = fixedCosts - noteTotals.fixedCosts;
          const variableCostDetailGap = variableCosts - noteTotals.variableCosts;
          const baseFixedCosts = Math.max(0, fixedCostDetailGap);
          const baseVariableCosts = Math.max(0, variableCostDetailGap);
          const essential = fixedCosts + variableCosts;
          const freeCash = income - essential;
          const emergencyFundAllocation = Math.max(0, Number(state.emergencyFundAllocation) || 0);
          const currentNetWorth = freeCash - emergencyFundAllocation;
          const investmentAllocation = Math.max(0, Number(state.investedCapital) || 0);
          const flexibleCashAllocation = Math.max(0, Number(state.flexibleCashFunds) || 0);
          const investmentDetailGap = investmentAllocation - noteTotals.investments;
          const flexibleCashDetailGap = flexibleCashAllocation - noteTotals.flexibleCash;
          const unclassifiedInvestmentAllocation = Math.max(0, investmentDetailGap);
          const baseFlexibleCashAllocation = Math.max(0, flexibleCashDetailGap);
          const allocatedCapital = investmentAllocation + flexibleCashAllocation;
          const investable = Math.max(0, currentNetWorth);
          const emergencyFundTarget = 6000;
          const currentPeriodId = `${state.year}-${state.monthName}`.toLowerCase().trim();
          const historicalEmergencyFund = (state.monthlyHistory || [])
            .filter((month) => month.id !== currentPeriodId && month.id !== editingMonthId)
            .reduce((sum, month) => sum + Math.max(0, Number(month.emergencyFundAllocation) || 0), 0);
          const projectedEmergencyFund = historicalEmergencyFund + emergencyFundAllocation;
          const emergencyGap = Math.max(0, emergencyFundTarget - projectedEmergencyFund);
          const emergencyProgress = emergencyFundTarget > 0 ? Math.min(100, (projectedEmergencyFund / emergencyFundTarget) * 100) : 0;
          const spendable = currentNetWorth;
          const ratio = income > 0 ? (currentNetWorth / income) * 100 : 0;
          const unallocatedCapital = currentNetWorth - allocatedCapital;

          return {
            income,
            baseIncome,
            decemberBonusNet,
            noteTotals,
            baseFixedCosts,
            baseVariableCosts,
            fixedCosts,
            variableCosts,
            essential,
            freeCash,
            currentNetWorth,
            investable,
            emergencyFundAllocation,
            unclassifiedInvestmentAllocation,
            investmentAllocation,
            baseFlexibleCashAllocation,
            flexibleCashAllocation,
            fixedCostDetailGap,
            variableCostDetailGap,
            investmentDetailGap,
            flexibleCashDetailGap,
            allocatedCapital,
            emergencyFundTarget,
            historicalEmergencyFund,
            projectedEmergencyFund,
            emergencyGap,
            emergencyProgress,
            spendable,
            ratio,
            unallocatedCapital
          };
        }, [state, editingMonthId]);

        function updateField(field, value) {
          setState((current) => ({ ...current, [field]: value }));
        }

        function addEntry() {
          const isInvestment = entry.category === "Investimento";
          const isIbkrInvestment = isInvestment && entry.managementSource === "IBKR";
          if ((!isIbkrInvestment && !entry.label.trim()) || !entry.amount) return;
          const isManualInvestment = isInvestment && entry.managementSource === "Manuale";
          const entryPrice = Number(entry.entryPrice) || 0;
          const amount = Number(entry.amount) || 0;
          const quantity = Number(entry.quantity) || (entryPrice > 0 ? amount / entryPrice : 1);
          const item = normalizeNote({
            id: entry.id || `${Date.now()}-${Math.random().toString(16).slice(2)}`,
            label: isIbkrInvestment ? "Capitale versato su IBKR" : entry.label.trim(),
            amount,
            category: entry.category,
            managementSource: isInvestment ? entry.managementSource : "",
            currentValue: isManualInvestment ? Math.max(0, numberOrFallback(entry.currentValue, amount)) : 0,
            investmentType: isManualInvestment ? entry.investmentType : "",
            investmentDetail: isManualInvestment ? entry.investmentDetail.trim() : "",
            ticker: isManualInvestment ? entry.ticker.trim().toUpperCase() : "",
            purchaseDate: isManualInvestment ? entry.purchaseDate : "",
            entryPrice: isManualInvestment ? entryPrice : 0,
            quantity: isManualInvestment ? quantity : 0,
            marketCurrency: isManualInvestment ? entry.marketCurrency : "",
            geography: isManualInvestment ? entry.geography : "",
            continent: isManualInvestment ? entry.continent : ""
          });
          setState((current) => ({
            ...current,
            notes: entry.id
              ? current.notes.map((note) => note.id === entry.id ? item : note)
              : [...current.notes, item]
          }));
          setEntry(createEmptyEntry());
        }

        function editEntry(item) {
          const normalized = normalizeNote(item);
          setEntry({
            id: normalized.id,
            label: normalized.managementSource === "IBKR" ? "Capitale versato su IBKR" : normalized.label || "",
            amount: normalized.amount || "",
            category: normalized.category || "Costo Variabile",
            managementSource: normalized.managementSource || "Manuale",
            currentValue: normalized.currentValue ?? normalized.amount ?? "",
            investmentType: normalized.investmentType || "Liquidita'",
            investmentDetail: normalized.investmentDetail || "",
            ticker: normalized.ticker || "",
            purchaseDate: normalized.purchaseDate || new Date().toISOString().slice(0, 10),
            entryPrice: normalized.entryPrice || "",
            quantity: normalized.quantity || "",
            marketCurrency: normalized.marketCurrency || "EUR",
            geography: normalized.geography || "Globale",
            continent: normalized.continent || continentForCountry(normalized.geography || "Globale")
          });
        }

        function removeEntry(index) {
          setState((current) => ({ ...current, notes: current.notes.filter((_, i) => i !== index) }));
        }

        function resetCustomEntries() {
          if (!window.confirm("Eliminare soltanto le voci dettagliate del mese corrente? Lo storico mensile non verra' modificato.")) return;
          setState((current) => ({ ...current, notes: [] }));
          setEntry(createEmptyEntry());
        }

        function buildSnapshot() {
          return {
            budgetModelVersion: 4,
            id: `${state.year}-${state.monthName}`.toLowerCase().trim() || String(Date.now()),
            monthName: state.monthName,
            year: Number(state.year) || 2026,
            income: totals.income,
            baseIncome: totals.baseIncome,
            decemberBonusNet: totals.decemberBonusNet,
            baseFixedCosts: totals.baseFixedCosts,
            baseVariableCosts: totals.baseVariableCosts,
            fixedCosts: totals.fixedCosts,
            variableCosts: totals.variableCosts,
            freeCash: totals.freeCash,
            investable: totals.investable,
            emergencyFundAllocation: totals.emergencyFundAllocation,
            unclassifiedInvestmentAllocation: totals.unclassifiedInvestmentAllocation,
            investmentAllocation: totals.investmentAllocation,
            baseFlexibleCashAllocation: totals.baseFlexibleCashAllocation,
            flexibleCashAllocation: totals.flexibleCashAllocation,
            fixedCostDetailGap: totals.fixedCostDetailGap,
            variableCostDetailGap: totals.variableCostDetailGap,
            investmentDetailGap: totals.investmentDetailGap,
            flexibleCashDetailGap: totals.flexibleCashDetailGap,
            allocatedCapital: totals.allocatedCapital,
            unallocatedCapital: totals.unallocatedCapital,
            emergencyFundTarget: totals.emergencyFundTarget,
            projectedEmergencyFund: totals.projectedEmergencyFund,
            currentNetWorth: totals.currentNetWorth,
            investedCapital: totals.investmentAllocation,
            annualNetSalary: salaryEstimate.annualNet,
            monthlyNetSalary: salaryEstimate.monthlyNet,
            wealthTotal: livePortfolio.netLiquidation,
            portfolioMarketValue: livePortfolio.netLiquidation,
            ibkrCash: livePortfolio.positiveCash,
            liquidityAvailable: livePortfolio.positiveCash,
            notes: state.notes,
            savedAt: new Date().toISOString()
          };
        }

        function persistMonthSnapshot(snapshot, sourceId = "") {
          setState((current) => {
            const existing = current.monthlyHistory || [];
            const withoutSameMonth = existing.filter((item) => item.id !== snapshot.id && item.id !== sourceId);
            return { ...current, monthlyHistory: recalibrateMonthlyHistory([...withoutSameMonth, snapshot]) };
          });
        }

        function saveMonthSnapshot() {
          const snapshot = buildSnapshot();
          persistMonthSnapshot(snapshot, editingMonthId);
          setEditingMonthId(snapshot.id);
        }

        function startNextMonth() {
          const nextPeriod = nextMonth(state.monthName, state.year);
          persistMonthSnapshot(buildSnapshot(), editingMonthId);
          setEditingMonthId("");
          setState((current) => ({
            ...current,
            monthName: nextPeriod.monthName,
            year: nextPeriod.year,
            emergencyFundAllocation: 0,
            investedCapital: 0,
            flexibleCashFunds: 0,
            variableCosts: 0,
            decemberBonusNet: 0,
            notes: current.notes.filter((item) => item.category === "Costo Fisso")
          }));
        }

        function loadSnapshot(snapshot) {
          setEditingMonthId(snapshot.id);
          setEntry(createEmptyEntry());
          setState((current) => ({
            ...current,
            monthName: snapshot.monthName,
            year: snapshot.year || current.year,
            income: snapshot.baseIncome ?? (Number(snapshot.income || 0) - Number(snapshot.decemberBonusNet || 0)),
            decemberBonusNet: snapshot.decemberBonusNet || 0,
            fixedCosts: Math.max(0, Number(snapshot.fixedCosts) || 0),
            variableCosts: Math.max(0, Number(snapshot.variableCosts) || 0),
            investedCapital: Math.max(0, Number(snapshot.investmentAllocation ?? snapshot.investedCapital) || 0),
            flexibleCashFunds: Math.max(0, Number(snapshot.flexibleCashAllocation) || 0),
            emergencyFundAllocation: snapshot.emergencyFundAllocation || 0,
            notes: (snapshot.notes || current.notes).map(normalizeNote)
          }));
          requestAnimationFrame(() => document.getElementById("monthly-input")?.scrollIntoView({ behavior: "smooth", block: "start" }));
        }

        function deleteSnapshot(id) {
          setEditingMonthId((current) => current === id ? "" : current);
          setState((current) => {
            const currentPeriodId = `${current.year}-${current.monthName}`.toLowerCase().trim();
            return {
              ...current,
              emergencyFundAllocation: id === currentPeriodId ? 0 : current.emergencyFundAllocation,
              monthlyHistory: recalibrateMonthlyHistory((current.monthlyHistory || []).filter((item) => item.id !== id))
            };
          });
        }

        const investRatio = totals.income > 0 ? (totals.investmentAllocation / totals.income) * 100 : 0;
        const detailCategories = [
          { value: "Costo Fisso", label: "Costo fisso", target: totals.fixedCosts, detailed: totals.noteTotals.fixedCosts, gap: totals.fixedCostDetailGap },
          { value: "Costo Variabile", label: "Costo variabile", target: totals.variableCosts, detailed: totals.noteTotals.variableCosts, gap: totals.variableCostDetailGap },
          { value: "Investimento", label: "Investimento", target: totals.investmentAllocation, detailed: totals.noteTotals.investments, gap: totals.investmentDetailGap },
          { value: "Flexible Cash", label: "Flexible cash", target: totals.flexibleCashAllocation, detailed: totals.noteTotals.flexibleCash, gap: totals.flexibleCashDetailGap }
        ];
        const selectedDetailCategory = detailCategories.find((category) => category.value === entry.category) || detailCategories[1];
        const originalEditedEntry = entry.id ? state.notes.find((note) => note.id === entry.id) : null;
        const originalAmountInSelectedCategory = originalEditedEntry?.category === entry.category
          ? Math.max(0, Number(originalEditedEntry.amount) || 0)
          : 0;
        const pendingEntryAmount = Math.max(0, Number(entry.amount) || 0);
        const projectedDetailedAmount = selectedDetailCategory.detailed - originalAmountInSelectedCategory + pendingEntryAmount;
        const projectedDetailGap = selectedDetailCategory.target - projectedDetailedAmount;
        const emergencyProgressValue = Math.min(100, Math.max(0, Number(totals.emergencyProgress) || 0));
        const emergencyHue = emergencyProgressValue <= 50
          ? (emergencyProgressValue / 50) * 50
          : 50 + ((emergencyProgressValue - 50) / 50) * 82;
        const emergencyStatusStyle = {
          "--emergency-color": `hsl(${emergencyHue} 90% 54%)`,
          "--emergency-bright": `hsl(${emergencyHue} 94% 68%)`,
          "--emergency-dark": `hsl(${emergencyHue} 82% 36%)`,
          "--emergency-glow": `hsla(${emergencyHue},95%,56%,.58)`,
          "--emergency-contrast": emergencyProgressValue >= 40 ? "#11150b" : "#ffffff"
        };
        const salaryEstimate = useMemo(() => {
          const grossSalary = Number(state.grossSalary) || 0;
          const paychecks = Math.max(1, Number(state.paychecks) || 13);
          const employeeContribution = grossSalary * ((Number(state.employeeContributionPct) || 0) / 100);
          const taxableIncome = Math.max(0, grossSalary - employeeContribution);
          const grossIrpef = calculateIrpef(taxableIncome);
          const employeeDeduction = calculateEmployeeDeduction(taxableIncome, state.workDays);
          const wageSupport = calculateWageSupport(taxableIncome, state.workDays);
          const netIrpef = Math.max(0, grossIrpef - employeeDeduction);
          const localTaxes = taxableIncome * (((Number(state.regionalTaxPct) || 0) + (Number(state.municipalTaxPct) || 0)) / 100);
          const annualNet = Math.max(0, grossSalary - employeeContribution - netIrpef - localTaxes + wageSupport);

          return {
            grossSalary,
            paychecks,
            employeeContribution,
            taxableIncome,
            grossIrpef,
            employeeDeduction,
            wageSupport,
            netIrpef,
            localTaxes,
            annualNet,
            monthlyNet: annualNet / paychecks,
            taxAndContribPct: grossSalary > 0 ? ((grossSalary - annualNet) / grossSalary) * 100 : 0
          };
        }, [state.grossSalary, state.paychecks, state.employeeContributionPct, state.regionalTaxPct, state.municipalTaxPct, state.workDays]);
        const monthlyHistory = useMemo(() => {
          return sortMonthlyHistory(state.monthlyHistory);
        }, [state.monthlyHistory]);
        const allInvestmentNotes = useMemo(() => {
          return monthlyHistory.flatMap((month) => (month.notes || [])
            .map(normalizeNote)
            .filter((note) => note.category === "Investimento")
            .map((note) => ({ ...note, period: `${month.monthName} ${month.year}`, periodId: month.id })));
        }, [monthlyHistory]);
        const manualPortfolio = useMemo(() => {
          const positions = allInvestmentNotes
            .filter((note) => note.managementSource === "Manuale")
            .map((note) => {
              const costBasis = Math.max(0, Number(note.amount) || 0);
              const currentValue = Math.max(0, numberOrFallback(note.currentValue, costBasis));
              return {
                ...note,
                costBasis,
                currentValue,
                unrealizedPnl: currentValue - costBasis,
                country: note.geography || "Non classificato",
                continent: note.continent || continentForCountry(note.geography)
              };
            });
          const byType = positions.reduce((totalsByType, position) => {
            const type = position.investmentType || "Altro";
            totalsByType[type] = (totalsByType[type] || 0) + position.currentValue;
            return totalsByType;
          }, {});
          const geographicPositions = positions.filter((position) => !String(position.investmentType || "").toLowerCase().includes("liquid"));
          const byContinent = geographicPositions.reduce((totalsByContinent, position) => {
            totalsByContinent[position.continent] = (totalsByContinent[position.continent] || 0) + position.currentValue;
            return totalsByContinent;
          }, {});
          const byCountry = geographicPositions.reduce((totalsByCountry, position) => {
            totalsByCountry[position.country] = (totalsByCountry[position.country] || 0) + position.currentValue;
            return totalsByCountry;
          }, {});
          const total = positions.reduce((sum, position) => sum + position.currentValue, 0);
          const costBasis = positions.reduce((sum, position) => sum + position.costBasis, 0);
          const liquidValue = positions
            .filter((position) => String(position.investmentType || "").toLowerCase().includes("liquid"))
            .reduce((sum, position) => sum + position.currentValue, 0);
          return {
            positions,
            byType,
            byContinent,
            byCountry,
            total,
            geographyTotal: geographicPositions.reduce((sum, position) => sum + position.currentValue, 0),
            costBasis,
            liquidValue,
            unrealizedPnl: total - costBasis,
            unrealizedPct: costBasis > 0 ? ((total - costBasis) / costBasis) * 100 : 0
          };
        }, [allInvestmentNotes]);
        const liveData = ibkrLive.data;
        const liveMetrics = liveData?.metrics || {};
        const liveCurrency = liveData?.baseCurrency || "EUR";
        const liveConnected = ibkrDataStatus(ibkrLive) === "current";
        const liveContractMetadataReady = Number(liveData?.contractMetadataVersion || 0) >= 1;
        const livePortfolio = useMemo(() => {
          const sourcePositions = liveConnected ? (liveData?.positions || []) : [];
          const preparedPositions = sourcePositions.map((position) => {
            const ibkrCountry = countryName(position.issuerCountryCode, position.issuerCountry || "");
            const country = ibkrCountry || "Non classificato";
            const continent = position.issuerContinent || continentForCountry(country);
            const nativeMarketValue = Number(position.marketValue) || 0;
            const quantity = Number(position.quantity) || 0;
            const marketPrice = Number(position.marketPrice) || 0;
            const averageCost = Number(position.averageCost) || 0;
            const rawExposure = Math.abs(nativeMarketValue || (quantity * marketPrice) || (quantity * averageCost));
            return {
              ...position,
              investmentType: position.assetClass || fallbackInvestmentType(position),
              investmentDetail: position.securityTypeLabel || "",
              country,
              continent,
              classificationSource: position.assetClass ? `IBKR ${position.securityType || "security type"}` : "Classificazione IBKR",
              geographySource: position.issuerCountrySource || (position.metadataStatus === "pending" ? "Metadati IBKR in caricamento" : "Paese non disponibile"),
              geographyEligible: position.securityType !== "CASH",
              rawExposure
            };
          });
          const rawGrossExposure = preparedPositions.reduce((sum, position) => sum + position.rawExposure, 0);
          const apiGrossExposure = liveConnected ? Math.abs(Number(liveMetrics.grossPositionValue) || 0) : 0;
          const grossPositionValue = apiGrossExposure || rawGrossExposure;
          const exposureScale = rawGrossExposure > 0 && apiGrossExposure > 0 ? apiGrossExposure / rawGrossExposure : 1;
          const positions = preparedPositions.map((position) => ({
            ...position,
            baseMarketValue: position.rawExposure * exposureScale
          }));
          const investmentPositions = positions.filter((position) => position.securityType !== "CASH");
          const geographicPositions = positions.filter((position) => position.geographyEligible);
          const byType = investmentPositions.reduce((totalsByType, position) => {
            totalsByType[position.investmentType] = (totalsByType[position.investmentType] || 0) + position.baseMarketValue;
            return totalsByType;
          }, {});
          const byContinent = geographicPositions.reduce((totalsByContinent, position) => {
            totalsByContinent[position.continent] = (totalsByContinent[position.continent] || 0) + position.baseMarketValue;
            return totalsByContinent;
          }, {});
          const byCountry = geographicPositions.reduce((totalsByCountry, position) => {
            totalsByCountry[position.country] = (totalsByCountry[position.country] || 0) + position.baseMarketValue;
            return totalsByCountry;
          }, {});
          const geographyPositionValue = geographicPositions.reduce((sum, position) => sum + position.baseMarketValue, 0);
          const totalCash = liveConnected ? Number(liveMetrics.totalCash) || 0 : 0;
          const positiveCash = Math.max(0, totalCash);
          const byAssetClass = { ...byType };
          if (positiveCash > 0) byAssetClass["Liquidita'"] = (byAssetClass["Liquidita'"] || 0) + positiveCash;
          const netLiquidation = liveConnected ? Number(liveMetrics.netLiquidation) || 0 : 0;
          const unrealizedPnl = liveConnected ? Number(liveMetrics.unrealizedPnl) || 0 : 0;
          const realizedPnl = liveConnected ? Number(liveMetrics.realizedPnl) || 0 : 0;
          const activeCostBasis = Math.max(0, grossPositionValue - unrealizedPnl);

          return {
            connected: liveConnected,
            positions,
            netLiquidation,
            grossPositionValue,
            totalCash,
            positiveCash,
            unrealizedPnl,
            realizedPnl,
            unrealizedPct: activeCostBasis > 0 ? (unrealizedPnl / activeCostBasis) * 100 : 0,
            activeCostBasis,
            byType,
            byAssetClass,
            byContinent,
            byCountry,
            geographyPositionValue,
            assetClassTotal: Object.values(byAssetClass).reduce((sum, value) => sum + value, 0)
          };
        }, [liveConnected, liveData, liveMetrics]);
        const historicalInvestmentTotals = useMemo(() => {
          return mergeValueMaps(livePortfolio.byType, manualPortfolio.byType);
        }, [livePortfolio.byType, manualPortfolio.byType]);
        const historicalInvestmentTotal = Object.values(historicalInvestmentTotals).reduce((sum, value) => sum + Number(value || 0), 0);
        const historyStats = useMemo(() => {
          const totalFreeCash = monthlyHistory.reduce((sum, item) => sum + Number(item.freeCash || 0), 0);
          const totalInvestable = monthlyHistory.reduce((sum, item) => sum + Number(item.investmentAllocation ?? item.investable ?? 0), 0);
          const first = monthlyHistory[0];
          const last = monthlyHistory[monthlyHistory.length - 1];
          const netWorthChange = first && last ? Number(last.currentNetWorth || 0) - Number(first.currentNetWorth || 0) : 0;
          const investedChange = first && last ? Number(last.investedCapital || 0) - Number(first.investedCapital || 0) : 0;

          return { totalFreeCash, totalInvestable, netWorthChange, investedChange };
        }, [monthlyHistory]);
        const wealthOverview = useMemo(() => {
          const savedFlexibleCash = monthlyHistory.reduce((sum, month) => sum + Math.max(0, Number(month.flexibleCashAllocation) || 0), 0);
          const flexibleCash = savedFlexibleCash;
          const emergencyFund = monthlyHistory.reduce((sum, month) => sum + Math.max(0, Number(month.emergencyFundAllocation) || 0), 0);
          const total = livePortfolio.netLiquidation + manualPortfolio.total + emergencyFund + flexibleCash;
          const liquidityAvailable = emergencyFund + flexibleCash + livePortfolio.positiveCash + manualPortfolio.liquidValue;
          const combinedInvestmentsByType = mergeValueMaps(livePortfolio.byType, manualPortfolio.byType);
          const riskExposures = [
            ...Object.entries(combinedInvestmentsByType).map(([type, value]) => ({
              type,
              value: Math.max(0, Number(value) || 0),
              weight: riskWeightForType(type)
            })),
            { type: "Liquidità positiva IBKR", value: livePortfolio.positiveCash, weight: 8 },
            { type: "Flexible cash", value: flexibleCash, weight: 8 },
            { type: "Fondo emergenza", value: emergencyFund, weight: 0 }
          ].filter((item) => item.value > 0);
          const riskExposureTotal = riskExposures.reduce((sum, item) => sum + item.value, 0);
          const riskScore = riskExposureTotal > 0
            ? riskExposures.reduce((sum, item) => sum + (item.value * item.weight), 0) / riskExposureTotal
            : null;

          const combinedAssetClasses = mergeValueMaps(livePortfolio.byAssetClass, manualPortfolio.byType);
          const combinedContinents = mergeValueMaps(livePortfolio.byContinent, manualPortfolio.byContinent);
          const combinedCountries = mergeValueMaps(livePortfolio.byCountry, manualPortfolio.byCountry);
          const productEntries = Object.entries(combinedAssetClasses)
            .map(([label, value]) => ({ label, value }))
            .filter((item) => item.value > 0)
            .sort((a, b) => b.value - a.value);
          const continentEntries = Object.entries(combinedContinents)
            .map(([label, value]) => ({ label, value }))
            .filter((item) => item.value > 0)
            .sort((a, b) => b.value - a.value);
          const countryEntries = Object.entries(combinedCountries)
            .map(([label, value]) => ({ label, value }))
            .filter((item) => item.value > 0)
            .sort((a, b) => b.value - a.value);

          const validSnapshots = monthlyHistory.filter((month) => Number(month.wealthTotal) > 0);
          const lastTwelve = validSnapshots.slice(-12);
          const twelveMonthBase = Number(lastTwelve[0]?.wealthTotal) || 0;
          const twelveMonthGrowthPct = twelveMonthBase > 0 ? ((total - twelveMonthBase) / twelveMonthBase) * 100 : 0;
          const referenceYear = Number(state.year) || new Date().getFullYear();
          const referenceMonth = state.monthName;
          const yearAgoSnapshot = validSnapshots.find((month) => Number(month.year) === referenceYear - 1 && month.monthName === referenceMonth);
          const yearAgoTotal = Number(yearAgoSnapshot?.wealthTotal) || 0;
          const yoyGrowthPct = yearAgoTotal > 0 ? ((total - yearAgoTotal) / yearAgoTotal) * 100 : null;

          const wealthSeries = validSnapshots.map((month) => Number(month.wealthTotal)).filter((value) => value > 0);
          if (total > 0 && wealthSeries[wealthSeries.length - 1] !== total) wealthSeries.push(total);
          const monthlyReturns = wealthSeries.slice(1).map((value, index) => (value / wealthSeries[index]) - 1);
          const meanReturn = monthlyReturns.length ? monthlyReturns.reduce((sum, value) => sum + value, 0) / monthlyReturns.length : 0;
          const returnVariance = monthlyReturns.length > 1
            ? monthlyReturns.reduce((sum, value) => sum + ((value - meanReturn) ** 2), 0) / (monthlyReturns.length - 1)
            : 0;
          const monthlyVolatility = Math.sqrt(returnVariance);
          const hasVarData = monthlyReturns.length > 1;
          const parametricVarAmount = hasVarData ? total * 2.32635 * monthlyVolatility : 0;
          const parametricVarPct = hasVarData ? 2.32635 * monthlyVolatility * 100 : 0;
          const riskLabel = riskScore === null
            ? "Non calcolabile"
            : riskScore <= 25
              ? "Prudente"
              : riskScore <= 60 ? "Moderato" : "Dinamico";

          return {
            total,
            emergencyFund,
            flexibleCash,
            liquidityAvailable,
            liquidityPct: total > 0 ? (liquidityAvailable / total) * 100 : 0,
            riskScore,
            riskExposureTotal,
            twelveMonthGrowthPct,
            yoyGrowthPct,
            yearAgoTotal,
            hasVarData,
            parametricVarAmount,
            parametricVarPct,
            riskLabel,
            productEntries,
            productTotal: Object.values(combinedAssetClasses).reduce((sum, value) => sum + value, 0),
            continentEntries,
            countryEntries,
            geographyTotal: livePortfolio.geographyPositionValue + manualPortfolio.geographyTotal,
            productGradient: buildDonutGradient(productEntries),
            continentGradient: buildDonutGradient(continentEntries),
            countryGradient: buildDonutGradient(countryEntries),
            liveConnected
          };
        }, [liveConnected, livePortfolio, manualPortfolio, monthlyHistory, state.monthName, state.year]);

        return (
          <div className="app">
            <div className="shell">
              <header className="dashboard-title">

                              <strong>Profilo di rischio</strong>
                              <InfoTip label="calcolo del profilo di rischio">
                                Punteggio = somma di ogni esposizione × relativo peso, divisa per le esposizioni complessive. Pesi su 100: fondo emergenza 0; liquidità 5; liquidità positiva IBKR e flexible cash 8; titoli di Stato 12; obbligazioni corporate/altre 30; Real Estate/REIT 45; fondi 50; ETF 55; indici e categorie non classificate 60; commodities 65; azioni, equity e passion assets 70; Forex 75; crypto 95; opzioni e derivati 100. Soglie: Prudente 0–25, Moderato oltre 25 e fino a 60, Dinamico oltre 60.
                              </InfoTip>
                            </div>
                          </div>
                          <div className="indicator-value">{wealthOverview.riskLabel}</div>
                          <div>
                            <div className="indicator-status" style={{ marginBottom: 7 }}>
                              {wealthOverview.riskScore === null ? "Servono esposizioni patrimoniali" : `Punteggio ${precise(wealthOverview.riskScore, 1)} / 100`}
                            </div>
                            <div className="risk-thresholds" aria-label={`Soglie del profilo di rischio${wealthOverview.riskScore === null ? "" : `; punteggio attuale ${precise(wealthOverview.riskScore, 1)} su 100`}`}>
                              <span className={`risk-threshold prudente ${wealthOverview.riskLabel === "Prudente" ? "active" : ""}`}>Prudente 0–25</span>
                              <span className={`risk-threshold moderato ${wealthOverview.riskLabel === "Moderato" ? "active" : ""}`}>Moderato 25,1–60</span>
                              <span className={`risk-threshold dinamico ${wealthOverview.riskLabel === "Dinamico" ? "active" : ""}`}>Dinamico 60,1–100</span>
                            </div>
                          </div>
                        </div>
                        <div className="indicator-row">
                          <div className="title-with-info">
                            <strong>Value at Risk parametrico</strong>
                            <InfoTip label="calcolo del Value at Risk">
                              Stima a un mese con confidenza 99%, basata sulla volatilità dei rendimenti mensili salvati. Servono almeno tre rilevazioni patrimoniali.
                            </InfoTip>
                          </div>
                          <div className="indicator-value negative">{wealthOverview.hasVarData ? money(wealthOverview.parametricVarAmount) : "n/d"}</div>
                          <div className="indicator-status">
                            {wealthOverview.hasVarData ? `${plainPct(wealthOverview.parametricVarPct)} del patrimonio` : "Servono almeno 3 rilevazioni patrimoniali"}
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                </section>
              </section>
            </div>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
