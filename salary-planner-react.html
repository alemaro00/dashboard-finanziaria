          const geographyPositionValue = geographicPositions.reduce((sum, position) => sum + position.baseMarketValue, 0);
          const totalCash = liveConnected ? Number(liveMetrics.totalCash) || 0 : 0;

          const positiveCurrencyCashTotal = cashBalances.reduce((sum, balance) => sum + Math.max(0, balance.baseValue), 0);

        const wealthOverview = useMemo(() => {

          const combinedCountries = mergeValueMaps(livePortfolio.byCountry, manualPortfolio.byCountry);
          const combinedCurrencies = mergeValueMaps(livePortfolio.byCurrency, manualPortfolio.byCurrency);
          const productEntries = Object.entries(combinedAssetClasses)
            .map(([label, value]) => ({ label, value }))
            .filter((item) => item.value > 0)
            .sort((a, b) => b.value - a.value);
          const continentEntries = Object.entries(combinedContinents)
            .map(([label, value]) => ({ label, value }))
            .filter((item) => item.value > 0)
            .sort((a, b) => b.value - a.value);
          const countryEntries = Object.entries(combinedCountries)
            .map(([label, value]) => ({ label, value }))
            .filter((item) => item.value > 0)
            .sort((a, b) => b.value - a.value);
          const currencyEntries = Object.entries(combinedCurrencies)
            .map(([label, value]) => ({ label, value }))
            .filter((item) => item.value > 0)
            .sort((a, b) => b.value - a.value);

          const validSnapshots = monthlyHistory.filter((month) => Number(month.wealthTotal) > 0);
          const lastTwelve = validSnapshots.slice(-12);
          const twelveMonthBase = Number(lastTwelve[0]?.wealthTotal) || 0;
          const twelveMonthGrowthPct = twelveMonthBase > 0 ? ((total - twelveMonthBase) / twelveMonthBase) * 100 : 0;
          const referenceYear = Number(state.year) || new Date().getFullYear();
          const referenceMonth = state.monthName;
          const yearAgoSnapshot = validSnapshots.find((month) => Number(month.year) === referenceYear - 1 && month.monthName === referenceMonth);
          const yearAgoTotal = Number(yearAgoSnapshot?.wealthTotal) || 0;
          const yoyGrowthPct = yearAgoTotal > 0 ? ((total - yearAgoTotal) / yearAgoTotal) * 100 : null;

          const wealthSeries = validSnapshots.map((month) => Number(month.wealthTotal)).filter((value) => value > 0);
          if (total > 0 && wealthSeries[wealthSeries.length - 1] !== total) wealthSeries.push(total);
          const monthlyReturns = wealthSeries.slice(1).map((value, index) => (value / wealthSeries[index]) - 1);
          const meanReturn = monthlyReturns.length ? monthlyReturns.reduce((sum, value) => sum + value, 0) / monthlyReturns.length : 0;
          const returnVariance = monthlyReturns.length > 1
            ? monthlyReturns.reduce((sum, value) => sum + ((value - meanReturn) ** 2), 0) / (monthlyReturns.length - 1)
            : 0;
          const monthlyVolatility = Math.sqrt(returnVariance);
          const hasVarData = monthlyReturns.length > 1;
          const parametricVarAmount = hasVarData ? total * 2.32635 * monthlyVolatility : 0;
          const parametricVarPct = hasVarData ? 2.32635 * monthlyVolatility * 100 : 0;
          const riskLabel = riskScore === null
            ? "Non calcolabile"
            : riskScore <= 25
              ? "Prudente"
              : riskScore <= 60 ? "Moderato" : "Dinamico";

          return {
            total,
            emergencyFund,
            flexibleCash,
            liquidityAvailable,
            liquidityPct: total > 0 ? (liquidityAvailable / total) * 100 : 0,
            riskScore,
            riskExposureTotal,
            twelveMonthGrowthPct,
            yoyGrowthPct,
            yearAgoTotal,
            hasVarData,
            parametricVarAmount,
            parametricVarPct,
            riskLabel,
            productEntries,
            productTotal: Object.values(combinedAssetClasses).reduce((sum, value) => sum + value, 0),
            continentEntries,
            countryEntries,
            currencyEntries,
            geographyTotal: livePortfolio.geographyPositionValue + manualPortfolio.geographyTotal,
            currencyTotal: currencyEntries.reduce((sum, item) => sum + item.value, 0),
            productGradient: buildDonutGradient(productEntries),
            continentGradient: buildDonutGradient(continentEntries),
            countryGradient: buildDonutGradient(countryEntries),
            currencyGradient: buildDonutGradient(currencyEntries),
            liveConnected
          };
        }, [liveConnected, livePortfolio, manualPortfolio, monthlyHistory, state.monthName, state.year]);

                            <td>
                              <strong>{position.symbol}</strong>
                              <div className="small">{position.description}{position.investmentDetail ? ` | ${position.investmentDetail}` : ""}</div>
                            </td>
                            <td>{position.investmentType}</td>
                            <td>{position.continent}</td>
                            <td>{position.country}</td>
                            <td className="numeric">{precise(position.quantity, 6)}</td>
                            <td className="numeric">{accountMoney(position.averageCost, position.currency || liveCurrency)}</td>
                            <td className="numeric">{accountMoney(position.marketPrice, position.currency || liveCurrency)}</td>
                            <td className="numeric">{accountMoney(position.baseMarketValue, liveCurrency)}</td>
                            <td className={`numeric ${position.unrealizedPnl > 0 ? "positive" : position.unrealizedPnl < 0 ? "negative" : ""}`}>
                              <strong>{accountMoney(position.unrealizedPnl, position.currency || liveCurrency)}</strong>
                            </td>
                            <td>
                              <strong>{position.exchange || "SMART"}</strong>
                              <div className="small">{position.currency || liveCurrency} | {position.classificationSource}</div>
                              <div className="small">Geografia: {position.geographySource}</div>
                            </td>
                          </tr>
                        ))}
                        {livePortfolio.positions.length === 0 && (
                          <tr><td colSpan="10" className="small">Nessuna posizione aperta rilevata nel conto IBKR Live.</td></tr>
                        )}
                      </tbody>
                    </table>
                  </div>

                  <div className="table-wrap wealth-illiquid-table" style={{ marginTop: 18 }}>
                    <div className="section-head">
                      <div className="title">Investimenti illiquidi</div>
                      <span className="badge">{manualPortfolio.positions.length} {manualPortfolio.positions.length === 1 ? "posizione illiquida" : "posizioni illiquide"}</span>
                    </div>
                    <table>
                      <thead>
                        <tr>
                          <th>Asset</th>
                          <th>Asset class</th>
                          <th>Periodo</th>
                          <th>Continente</th>
                          <th>Paese</th>
                          <th className="numeric">Capitale allocato</th>
                          <th className="numeric">Valore attuale</th>
                          <th className="numeric">P/L stimato</th>
                        </tr>
                      </thead>
                      <tbody>
                        {manualPortfolio.positions.map((position) => (
                          <tr key={`${position.periodId}-${position.id}`}>
                            <td>
                              <strong>{position.label}</strong>
                              <div className="small">{position.investmentDetail || "Valorizzazione stimata"}</div>
                            </td>
                            <td>{position.investmentType || "Altro"}</td>
                            <td>{position.period}</td>
                            <td>{position.continent}</td>
                            <td>{position.country}</td>
                            <td className="numeric">{money(position.costBasis)}</td>
                            <td className="numeric"><strong>{money(position.currentValue)}</strong></td>
                            <td className={`numeric ${position.unrealizedPnl > 0 ? "positive" : position.unrealizedPnl < 0 ? "negative" : ""}`}>{money(position.unrealizedPnl)}</td>
                          </tr>
                        ))}
                        {manualPortfolio.positions.length === 0 && (
                          <tr><td colSpan="8" className="small">Nessun investimento illiquido presente nei mesi salvati.</td></tr>
                        )}
                      </tbody>
                    </table>
                  </div>

                  <div className="wealth-layout">
                    <div className="wealth-panel">
                      <div className="wealth-panel-head">
                        <h3>Esposizione per asset class | IBKR + investimenti illiquidi</h3>
                        <span className="wealth-chip">Totale: {accountMoney(wealthOverview.productTotal, liveCurrency)}</span>
                      </div>
                      <div className="donut-layout">
                        <div className="donut-wrap">
                          <div className="donut" style={{ background: wealthOverview.productGradient }} role="img" aria-label="Grafico esposizione per asset class del conto IBKR Live">
                            <div className="donut-center">
                              <strong>{accountMoney(wealthOverview.productTotal, liveCurrency)}</strong>
                              <span>Portafoglio investimenti</span>
                            </div>
                          </div>
                        </div>
                        <div className="exposure-list">
                          {wealthOverview.productEntries.map((item, index) => (
                            <div className="exposure-row" key={item.label}>
                              <div>
                                <div className="exposure-name">
                                  <span className="exposure-dot" style={{ background: wealthColors[index % wealthColors.length] }}></span>
                                  <span>{item.label}</span>
                                </div>
                                <div className="small" style={{ marginLeft: 22 }}>{plainPct(wealthOverview.productTotal ? (item.value / wealthOverview.productTotal) * 100 : 0)} del portafoglio</div>
                              </div>
                              <div className="exposure-value">{accountMoney(item.value, liveCurrency)}</div>
                            </div>
                          ))}
                          {wealthOverview.productEntries.length === 0 && <div className="decision-box">Nessuna esposizione IBKR o illiquida contabilizzata.</div>}
                        </div>
                      </div>
                    </div>

                    <div className="wealth-panel wealth-half">
                      <div className="wealth-panel-head">
                        <h3>Esposizione per Continente</h3>
                      </div>
                      <div className="donut-layout">
                        <div className="donut-wrap">
                          <div className="donut" style={{ background: wealthOverview.continentGradient }} role="img" aria-label="Grafico Esposizione per Continente del conto IBKR Live">
                            <div className="donut-center">
                              <strong>Continenti</strong>
                              <span>{accountMoney(wealthOverview.geographyTotal, liveCurrency)} esposti</span>
                            </div>
                          </div>
                        </div>
                        <div className="exposure-list">
                          {wealthOverview.continentEntries.map((item, index) => {
                            const share = wealthOverview.geographyTotal ? (item.value / wealthOverview.geographyTotal) * 100 : 0;
                            return (
                              <div className="exposure-row geo-row" key={item.label}>
                                <div>
                                  <strong>{item.label}</strong>
                                  <div className="small">{plainPct(share)} del portafoglio</div>
                                  <div className="geo-track"><span style={{ width: `${share}%` }}></span></div>
                                </div>
                                <div className="exposure-value">{accountMoney(item.value, liveCurrency)}</div>
                                <div className="geo-rank">#{index + 1} continente</div>
                              </div>
                            );
                          })}
                          {wealthOverview.continentEntries.length === 0 && <div className="decision-box">Nessuna posizione geografica disponibile oppure metadati IBKR ancora in caricamento.</div>}
                        </div>
                      </div>
                    </div>

                    <div className="wealth-panel wealth-half">
                      <div className="wealth-panel-head">
                        <h3>Esposizione per Paese</h3>
                      </div>
                      <div className="donut-layout">
                        <div className="donut-wrap">
                          <div className="donut" style={{ background: wealthOverview.countryGradient }} role="img" aria-label="Grafico esposizione per Paese del conto IBKR Live">
                            <div className="donut-center">
                              <strong>Paesi</strong>
                              <span>{accountMoney(wealthOverview.geographyTotal, liveCurrency)} esposti</span>
                            </div>
                          </div>
                        </div>
                        <div className="exposure-list">
                          {wealthOverview.countryEntries.map((item, index) => {
                            const share = wealthOverview.geographyTotal ? (item.value / wealthOverview.geographyTotal) * 100 : 0;
                            return (
                              <div className="exposure-row geo-row" key={item.label}>
                                <div>
                                  <strong>{item.label}</strong>
                                  <div className="small">{plainPct(share)} del portafoglio</div>
                                  <div className="geo-track"><span style={{ width: `${share}%` }}></span></div>
                                </div>
                                <div className="exposure-value">{accountMoney(item.value, liveCurrency)}</div>
                                <div className="geo-rank">#{index + 1} Paese</div>
                              </div>
                            );
                          })}
                          {wealthOverview.countryEntries.length === 0 && <div className="decision-box">Nessun Paese emittente disponibile oppure metadati IBKR ancora in caricamento.</div>}
                        </div>
                      </div>
                    </div>

                    <div className="wealth-panel">
                      <div className="wealth-panel-head">
                        <h3>Esposizione per Valuta</h3>
                      </div>
                      <div className="donut-layout">
                        <div className="donut-wrap">
                          <div className="donut" style={{ background: wealthOverview.currencyGradient }} role="img" aria-label="Grafico esposizione per valuta del portafoglio">
                            <div className="donut-center">
                              <strong>Valute</strong>
                              <span>{accountMoney(wealthOverview.currencyTotal, liveCurrency)} esposti</span>
                            </div>
                          </div>
                        </div>
                        <div className="exposure-list">
                          {wealthOverview.currencyEntries.map((item, index) => {
                            const share = wealthOverview.currencyTotal ? (item.value / wealthOverview.currencyTotal) * 100 : 0;
                            return (
                              <div className="exposure-row geo-row" key={item.label}>
                                <div>
                                  <strong>{item.label}</strong>
                                  <div className="small">{plainPct(share)} del portafoglio</div>
                                  <div className="geo-track"><span style={{ width: `${share}%` }}></span></div>
                                </div>
                                <div className="exposure-value">{accountMoney(item.value, liveCurrency)}</div>
                                <div className="geo-rank">#{index + 1} valuta</div>
                              </div>
                            );
                          })}
                          {wealthOverview.currencyEntries.length === 0 && <div className="decision-box">Nessuna esposizione valutaria disponibile.</div>}
                        </div>
                      </div>
                    </div>

                    <div className="wealth-panel">
                      <div className="wealth-panel-head">
                        <h3>Indicatori chiave</h3>
                      </div>
                      <div className="indicator-list">
                        <div className="indicator-row">
                          <div className="title-with-info">
                            <strong>Liquidita' disponibile contabilizzata</strong>
                            <InfoTip label="formula della liquidità disponibile">
                              Fondo emergenza + flexible cash dello storico salvato + liquidità IBKR Live.
                            </InfoTip>
                          </div>
                          <div className="indicator-value">{money(wealthOverview.liquidityAvailable)}</div>
                          <div className="indicator-status">{plainPct(wealthOverview.liquidityPct)} del patrimonio</div>
                        </div>
                        <div className="indicator-row">
                          <div>
                            <div className="title-with-info">
                              <strong>Profilo di rischio</strong>
                              <InfoTip label="calcolo del profilo di rischio">
                                Punteggio = somma di ogni esposizione × relativo peso, divisa per le esposizioni complessive. Pesi su 100: fondo emergenza 0; liquidità 5; liquidità positiva IBKR e flexible cash 8; titoli di Stato 12; obbligazioni corporate/altre 30; Real Estate/REIT 45; fondi 50; ETF 55; indici e categorie non classificate 60; commodities 65; azioni, equity e passion assets 70; Forex 75; crypto 95; opzioni e derivati 100. Soglie: Prudente 0–25, Moderato oltre 25 e fino a 60, Dinamico oltre 60.
                              </InfoTip>
                            </div>
                          </div>
                          <div className="indicator-value">{wealthOverview.riskLabel}</div>
                          <div>
                            <div className="indicator-status" style={{ marginBottom: 7 }}>
                              {wealthOverview.riskScore === null ? "Servono esposizioni patrimoniali" : `Punteggio ${precise(wealthOverview.riskScore, 1)} / 100`}
                            </div>
                            <div className="risk-thresholds" aria-label={`Soglie del profilo di rischio${wealthOverview.riskScore === null ? "" : `; punteggio attuale ${precise(wealthOverview.riskScore, 1)} su 100`}`}>
                              <span className={`risk-threshold prudente ${wealthOverview.riskLabel === "Prudente" ? "active" : ""}`}>Prudente 0–25</span>
                              <span className={`risk-threshold moderato ${wealthOverview.riskLabel === "Moderato" ? "active" : ""}`}>Moderato 25,1–60</span>
                              <span className={`risk-threshold dinamico ${wealthOverview.riskLabel === "Dinamico" ? "active" : ""}`}>Dinamico 60,1–100</span>
                            </div>
                          </div>
                        </div>
                        <div className="indicator-row">
                          <div className="title-with-info">
                            <strong>Rischio storico del portafoglio</strong>
                            <InfoTip label="calcolo del Value at Risk">
                              Calcolo sospeso: le variazioni del patrimonio includono entrate e prelievi. Servono rendimenti depurati dai flussi e una storia adeguata prima di stimare il rischio del portafoglio.
                            </InfoTip>
                          </div>
                          <div className="indicator-value negative">Non calcolato</div>
                          <div className="indicator-status">
                            Servono rendimenti depurati dai flussi
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                </section>
                </>
                )}
                </section>
              </section>
            </div>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
