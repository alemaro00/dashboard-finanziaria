<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard Finanziaria Beta</title>
    <script src="vendor/react-18.3.1.min.js"></script>
    <script src="vendor/react-dom-18.3.1.min.js"></script>
    <script src="vendor/babel-7.28.5.min.js"></script>
    <style>
      :root{
        --bg:#080a0f;
        --panel:#10151d;
        --panel-2:#151c26;
        --panel-3:#0c1118;
        --text:#e8edf5;
        --muted:#7f8b9c;
        --line:#263141;
        --line-soft:rgba(255,255,255,.06);
        --accent:#d7b46a;
        --accent-2:#6fb2d2;
        --selected-surface:#162536;
        --selected-border:#527792;
        --good:#42d392;
        --bad:#ff5f63;
        --warn:#e9b949;
        --shadow:0 18px 48px rgba(0,0,0,.34);
      }
      *{box-sizing:border-box}
      html{scroll-behavior:smooth}
      body{
        margin:0;
        font-family:"Segoe UI", Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        color:var(--text);
        background:var(--selected-surface);
      }
      .app{min-height:100vh;padding:18px}
      .shell{max-width:1580px;margin:0 auto}
      .hero{
        display:flex;justify-content:space-between;gap:20px;align-items:flex-end;
        padding:20px 22px;border:1px solid var(--line);border-radius:8px;
        background:linear-gradient(180deg, #141b25 0%, #0d1219 100%);
        box-shadow:var(--shadow);
      }
      .dashboard-title{padding:6px 2px 2px;display:flex;align-items:center;justify-content:space-between;gap:16px}
      .dashboard-title h1{margin:0;font-size:28px;display:flex;align-items:center;gap:10px}
      .beta-badge{padding:5px 8px;border:1px solid #4b8aa8;border-radius:999px;background:#102b3a;color:#bcecff;font-size:10px;font-weight:850;letter-spacing:.08em;text-transform:uppercase}
      .workspace-nav{
        position:sticky;top:10px;z-index:30;display:grid;grid-template-columns:repeat(2,1fr);gap:8px;
        margin:12px 0;padding:7px;border:1px solid #2a3545;border-radius:12px;
        background:rgba(9,13,19,.9);box-shadow:0 14px 34px rgba(0,0,0,.28);backdrop-filter:blur(16px);
      }
      .workspace-nav a{
        display:flex;align-items:center;gap:10px;min-width:0;padding:11px 13px;border-radius:8px;
        color:#cad4e1;text-decoration:none;font-size:12px;font-weight:750;text-transform:uppercase;letter-spacing:.055em;
        border:1px solid transparent;transition:.16s ease;
      }
      .workspace-nav a:hover,.workspace-nav a:focus-visible{color:#fff;background:#17202c;border-color:#344257;outline:none}
      .workspace-nav-index{
        display:grid;place-items:center;width:28px;height:28px;flex:0 0 auto;border-radius:7px;
        font-size:10px;font-weight:850;background:#202b39;border:1px solid #3a485c;color:#dce7f5;
      }
      .workspace-nav a:nth-child(1) .workspace-nav-index{color:#f4d98d;border-color:#745f30;background:#2b2414}
      .workspace-nav a:nth-child(2) .workspace-nav-index{color:#d9c7ff;border-color:#67548e;background:#251d3a}
      .macro-title-line{display:flex;align-items:center;gap:11px;min-width:0}
      .macro-number{
        display:grid;place-items:center;width:34px;height:34px;flex:0 0 auto;border-radius:9px;
        font-size:11px;font-weight:850;letter-spacing:.06em;border:1px solid currentColor;
      }
      .macro-section-card,.macro-section-shell{scroll-margin-top:92px;position:relative;overflow:hidden}
      .macro-section-card::before,.macro-section-shell::before{
        content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--macro-accent);
        box-shadow:0 0 20px var(--macro-glow);
      }
      .macro-finance{--macro-accent:#d7b46a;--macro-glow:rgba(215,180,106,.46);border-color:rgba(215,180,106,.38)}
      .macro-finance .macro-number{color:#f2d58d;background:rgba(126,91,26,.2)}
      .macro-wealth{--macro-accent:#a482ef;--macro-glow:rgba(164,130,239,.48);border-color:rgba(164,130,239,.38)}
      .macro-wealth .macro-number{color:#dfd0ff;background:rgba(92,61,151,.22)}
      .macro-section-shell{
        grid-column:span 12;display:flex;flex-direction:column;gap:12px;min-width:0;width:100%;padding:14px;border:1px solid rgba(164,130,239,.38);
        border-radius:12px;background:linear-gradient(145deg,rgba(31,24,47,.62),rgba(11,16,24,.94) 32%);
        box-shadow:0 20px 52px rgba(0,0,0,.28);
      }
      .macro-section-shell > *{min-width:0;width:100%}
      .macro-shell-heading{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:5px 5px 8px}
      .macro-shell-heading h2{margin:0;font-size:21px;letter-spacing:.01em}
      .macro-shell-controls{
        display:grid;grid-template-columns:22px 40px;align-items:center;justify-content:end;gap:10px;
        flex:0 0 72px;min-width:72px;
      }
      h1{margin:8px 0 10px;font-size:30px;line-height:1.15;font-weight:700;letter-spacing:0}
      .eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
      .sub{max-width:860px;color:var(--muted);line-height:1.5;font-size:13px}
      .pill{
        display:inline-flex;align-items:center;gap:8px;padding:7px 10px;border-radius:4px;
        background:#0b1017;border:1px solid var(--line);color:#b5c0cf;font-size:12px;
        text-transform:uppercase;letter-spacing:.08em;
      }
      .grid{display:grid;grid-template-columns:repeat(12,1fr);gap:12px;margin-top:12px}
      .card{
        background:linear-gradient(180deg, var(--panel) 0%, var(--panel-3) 100%);
        border:1px solid var(--line);border-radius:8px;padding:16px;box-shadow:0 10px 28px rgba(0,0,0,.24);
      }
      .metric{grid-column:span 3}
      .wide{grid-column:span 8}
      .side{grid-column:span 4}
      .full{grid-column:span 12}
      .label{font-size:11px;color:var(--muted);margin-bottom:8px;text-transform:uppercase;letter-spacing:.08em}
      .value{font-size:30px;font-weight:700;letter-spacing:0;font-variant-numeric:tabular-nums}
      .delta{margin-top:7px;font-size:12px;color:var(--good)}
      .delta.bad{color:var(--bad)}
      .section-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--line-soft)}
      .title-with-info{display:flex;align-items:center;gap:8px}
      .title{font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}
      .info-tip{position:relative;display:inline-flex;flex:0 0 auto}
      button.info-tip-button{
        width:22px;height:22px;padding:0;border-radius:50%;display:grid;place-items:center;
        color:#d7f4ff;background:#122332;border:1px solid #49718a;font:700 12px/1 Georgia,serif;
        text-transform:none;letter-spacing:0;box-shadow:none;
      }
      button.info-tip-button:hover,button.info-tip-button:focus-visible{color:#081018;background:#8ed7f4;border-color:#b9eaff}
      .info-tip-content{
        position:absolute;z-index:20;left:50%;top:calc(100% + 9px);width:min(410px,70vw);padding:12px 14px;
        border-radius:7px;border:1px solid #49657c;background:#09111a;color:#dce8f5;
        box-shadow:0 18px 42px rgba(0,0,0,.48);font-size:12px;line-height:1.55;text-transform:none;
        letter-spacing:0;font-weight:500;opacity:0;visibility:hidden;transform:translate(-50%,-4px);transition:.16s ease;
      }
      .info-tip:hover .info-tip-content,.info-tip:focus-within .info-tip-content{opacity:1;visibility:visible;transform:translate(-50%,0)}
      .small{font-size:12px;color:var(--muted);line-height:1.45}
      .form{
        display:grid;grid-template-columns:repeat(12,1fr);gap:10px;
      }
      .field{grid-column:span 6}
      .field.full-field{grid-column:span 12}
      .field.third{grid-column:span 4}
      .field.quarter{grid-column:span 3}
      label{display:block;font-size:11px;color:var(--muted);margin:0 0 5px;text-transform:uppercase;letter-spacing:.07em}
      input, select{
        width:100%;padding:9px 10px;border-radius:4px;border:1px solid #2d3849;
        background:#0a0f16;color:var(--text);outline:none;font-size:13px;
      }
      input:focus, select:focus{border-color:var(--accent-2);box-shadow:0 0 0 2px rgba(111,178,210,.14)}
      .actions{display:flex;gap:8px;flex-wrap:wrap}
      button{
        border:1px solid #c0a25e;border-radius:4px;padding:9px 12px;font-weight:700;cursor:pointer;
        color:#080a0f;background:linear-gradient(180deg,#e2c67f,#b99448);font-size:12px;text-transform:uppercase;letter-spacing:.04em;
      }
      button.secondary{
        color:#c9d3df;background:#101722;border:1px solid #344155;
      }
      button.toggle{
        display:inline-grid;place-items:center;width:40px;height:40px;min-width:40px;padding:0;
        color:#c96770;background:rgba(64,22,29,.55);border:1px solid rgba(201,103,112,.65);line-height:1;text-transform:none;
        box-shadow:none;
        transition:color .2s ease,background .2s ease,box-shadow .2s ease,transform .2s ease;
      }
      button.toggle:hover{color:#e18b93;background:rgba(88,29,39,.68);box-shadow:none;transform:translateY(-1px)}
      .toggle-chevron{
        width:13px;height:9px;background:currentColor;
        clip-path:polygon(0 0,50% 62%,100% 0,100% 38%,50% 100%,0 38%);
        transform:rotate(0deg);transition:transform .22s ease;
      }
      button.toggle[aria-expanded="true"]{color:#62b991;background:rgba(18,65,49,.58);border-color:rgba(98,185,145,.68);box-shadow:none}
      button.toggle[aria-expanded="true"]:hover{color:#88d1af;background:rgba(24,82,62,.68);box-shadow:none}
      button.toggle[aria-expanded="true"] .toggle-chevron{transform:rotate(180deg)}
      .rows{display:grid;gap:8px}
      .row{
        display:grid;grid-template-columns:1.2fr .8fr .8fr .6fr;gap:10px;align-items:center;
        padding:10px 12px;border-radius:6px;background:#0c1118;border:1px solid #202a38;
      }
      .row strong{display:block}
      .bar{
        height:5px;border-radius:999px;background:#202a38;overflow:hidden;margin-top:8px
      }
      .fill{height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--accent-2),var(--accent))}
      .badge{
        display:inline-flex;align-items:center;padding:6px 8px;border-radius:4px;font-size:11px;
        background:#0a0f16;border:1px solid var(--line);color:#bfcaD8;text-transform:uppercase;letter-spacing:.06em;
      }
      .decision-box{
        padding:12px;border-radius:6px;background:#0c1118;border:1px solid #202a38
      }
      .decision-box.good{border-color:rgba(99,230,167,.32);background:rgba(99,230,167,.08)}
      .decision-box.warn{border-color:rgba(255,204,102,.35);background:rgba(255,204,102,.08)}
      .decision-box.bad{border-color:rgba(255,123,123,.32);background:rgba(255,123,123,.08)}
      .bank-sync{display:grid;gap:12px}
      .bank-sync-status{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
      .bank-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
      .bank-kpi{padding:12px 14px;border:1px solid #283344;border-radius:8px;background:#0b1119}
      .bank-kpi strong{display:block;font-size:21px;margin-top:6px}
      .bank-income{color:#44d7a8}.bank-expense{color:#ff7d83}
      .bank-connections{display:flex;gap:7px;flex-wrap:wrap}
      .bank-setup-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}
      .bank-setup-step{padding:13px;border:1px solid #283344;border-radius:8px;background:#0b1119}
      .bank-setup-step strong{display:block;margin-bottom:6px;color:#f0d58d}
      .bank-setup-fields{display:grid;grid-template-columns:minmax(220px,1fr) minmax(220px,1fr);gap:10px;margin-top:12px}
      .bank-privacy-note{margin-top:12px;padding:11px 12px;border-left:3px solid var(--good);background:rgba(66,211,146,.06);color:#b8cbc8;font-size:12px;line-height:1.5}
      .bank-review-list{display:grid;gap:8px;max-height:340px;overflow:auto;padding:10px;border:1px solid #253244;border-radius:8px;background:#091019;overscroll-behavior:contain;scrollbar-gutter:stable}
      .bank-review-list>strong{position:sticky;top:-10px;z-index:1;padding:10px 2px 8px;background:#091019;border-bottom:1px solid #253244}
      .bank-review-item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center;padding:11px 12px;border:1px solid #2a3748;border-radius:7px;background:#0c131c}
      .bank-review-main{display:grid;gap:4px;min-width:0}
      .bank-review-main strong{overflow-wrap:anywhere}
      .bank-review-meta{display:flex;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:11px}
      .bank-review-action{text-align:right}
      .bank-review-action strong{display:block;color:#f0d58d;margin-bottom:6px}
      .bank-movement-window{display:grid;gap:8px;max-height:430px;overflow:auto;padding:10px;border:1px solid #253244;border-radius:8px;background:#091019;overscroll-behavior:contain;scrollbar-gutter:stable}
      .bank-movement-window>strong{position:sticky;top:-10px;z-index:2;padding:10px 2px 8px;background:#091019;border-bottom:1px solid #253244}
      .bank-movement-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center;padding:11px 12px;border:1px solid #2a3748;border-radius:7px;background:#0c131c}
      .bank-movement-name{overflow-wrap:anywhere}
      .bank-original-name{margin-top:5px;color:#7f8b9c;font-size:11px;overflow-wrap:anywhere}
      .bank-movement-side{display:grid;justify-items:end;gap:8px;min-width:230px}
      .bank-movement-actions{display:flex;gap:7px;justify-content:flex-end;flex-wrap:wrap}
      .bank-movement-actions button{padding:7px 10px}
      .bank-movement-actions button.selected{border-color:#d7b46a;background:rgba(215,180,106,.2);color:#f4d98d}
      .bank-rename-form{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:8px}
      .bank-rename-form input{min-width:260px;flex:1}
      .muted{color:var(--muted)}
      .split{display:grid;grid-template-columns:1fr 1fr;gap:10px}
      .mini{
        display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;
        padding:10px 12px;border-radius:6px;background:#0c1118;border:1px solid #202a38;
      }
      .readout{
        padding:14px;border:1px solid rgba(215,180,106,.55);border-radius:6px;
        background:linear-gradient(180deg, rgba(215,180,106,.16), rgba(215,180,106,.06));
      }
      .readout .value{font-size:34px;color:#f3d48d}
      .allocation-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
      .stack-form{grid-template-columns:1fr}
      .monthly-period-fields .field{grid-column:span 4;padding:12px;border:1px solid rgba(215,180,106,.55);border-radius:8px;background:rgba(215,180,106,.09)}
      .monthly-period-fields label{color:var(--accent)}
      .monthly-period-fields input,.monthly-period-fields select{border-color:rgba(215,180,106,.55);color:var(--accent)}
      .monthly-period-fields select{
        height:36px;min-height:36px;padding:0 10px;font-family:inherit;font-size:13px;line-height:1.2
      }
      .monthly-flow-inputs > .field.third{padding:12px;border:1px solid #283344;border-radius:8px;background:#0b1119}
      .monthly-flow-inputs output{display:block;padding:10px 0;color:#e5eaf2;font-size:21px;font-weight:700;font-variant-numeric:tabular-nums}
      .entry-detail-layout{align-items:start}
      .entry-detail-layout > .stack-form{align-self:start;align-content:start}
      .stack-form .field,.stack-form .field.third,.stack-form .field.quarter{grid-column:span 1}
      .meter{
        height:18px;border-radius:4px;background:#0a0f16;border:1px solid #2b3646;
        overflow:hidden;position:relative;
      }
      .meter-fill{height:100%;background:linear-gradient(90deg,var(--good),var(--accent-2));}
      .meter-line{
        display:flex;justify-content:space-between;gap:12px;margin-top:8px;color:var(--muted);
        font-size:12px;font-variant-numeric:tabular-nums;
      }
      .allocation-warning{color:var(--bad)}
      .allocation-ok{color:var(--good)}
      .allocation-pending{color:var(--warn)}
      .monthly-input-card{border-color:rgba(215,180,106,.42);box-shadow:0 16px 40px rgba(0,0,0,.28)}
      .monthly-flow-inputs + .bank-sync{margin-top:24px;padding-top:20px;border-top:1px solid rgba(215,180,106,.18)}
      .monthly-input-block + .monthly-input-block{margin-top:22px;padding-top:22px;border-top:1px solid rgba(215,180,106,.18)}
      .monthly-save-bar{
        display:flex;justify-content:space-between;align-items:center;gap:16px;margin-top:22px;padding:14px;
        border-radius:6px;border:1px solid rgba(215,180,106,.34);background:rgba(215,180,106,.07);
      }
      .entry-category-grid{display:flex;flex-wrap:nowrap;gap:8px;margin-bottom:14px;padding:2px;overflow-x:auto;overscroll-behavior-x:contain}
      .entry-category-chip{
        flex:1 0 160px;min-width:160px;min-height:58px;padding:12px;
        color:var(--text);background:#0c1118;border:1px solid var(--line);
        text-transform:none;letter-spacing:0;text-align:left;font-weight:600;
      }
      .entry-category-head{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
      .entry-category-title{font-size:11px;white-space:nowrap}
      .entry-category-head strong{font-size:16px;font-variant-numeric:tabular-nums;white-space:nowrap}
      .entry-category-chip.active,.entry-category-chip.active:hover,.entry-category-chip.active:focus,.entry-category-chip.active:active{
        color:var(--text);background:var(--selected-surface);border-color:var(--selected-border);box-shadow:none;
      }
      .entry-category-chip:hover{background:#0c1118;border-color:var(--selected-border)}
      .entry-category-chip:focus-visible{outline:2px solid var(--selected-border);outline-offset:2px}
      .entry-category-chip:focus:not(:focus-visible){outline:none}
      .entry-list-panel{display:grid;align-content:start;gap:10px;min-width:0}
      .entry-list-heading{display:flex;justify-content:space-between;align-items:center;gap:10px}
      .entry-list{display:grid;gap:9px}
      .entry-list-card{
        display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center;padding:13px 14px;
        border-radius:8px;border:1px solid #293648;background:linear-gradient(145deg,#111a25,#0b1118);
      }
      .entry-list-main{min-width:0}
      .entry-list-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
      .entry-list-top strong{font-size:14px;overflow-wrap:anywhere}
      .entry-kind{padding:3px 6px;border-radius:999px;border:1px solid #3a4a60;color:#a9c8ff;font-size:9px;text-transform:uppercase;letter-spacing:.07em}
      .entry-list-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
      .entry-list-meta span{padding:3px 6px;border-radius:4px;background:#172230;color:#9fb0c4;font-size:10px}
      .entry-list-value{text-align:right;white-space:nowrap}
      .entry-list-value>strong{display:block;font-size:18px;font-variant-numeric:tabular-nums;color:#f0d58d}
      .entry-list-actions{display:flex;justify-content:flex-end;gap:6px;margin-top:9px}
      .entry-list-actions button{padding:6px 8px;font-size:10px}
      .detail-gap-preview{padding:11px 12px;border-radius:6px;border:1px solid rgba(233,185,73,.34);background:rgba(233,185,73,.07)}
      .detail-gap-preview.complete{border-color:rgba(66,211,146,.36);background:rgba(66,211,146,.07)}
      .detail-gap-preview.over{border-color:rgba(255,95,99,.36);background:rgba(255,95,99,.07)}
      .detail-gap-preview-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
      .detail-gap-preview-grid span{display:grid;gap:3px}
      .detail-gap-preview-grid small{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.06em}
      .detail-gap-preview-grid strong{font-size:14px;font-variant-numeric:tabular-nums}
      .detail-gap-status{margin-top:8px;font-size:12px;color:var(--warn)}
      .detail-gap-preview.complete .detail-gap-status{color:var(--good)}
      .detail-gap-preview.over .detail-gap-status{color:var(--bad)}
      .allocation-patrimony{height:100%;min-height:94px}
      .allocation-patrimony .value{font-size:28px}
      .history-list{display:grid;gap:10px}
      .history-item{border:1px solid #263141;border-radius:7px;background:#0c1118;overflow:hidden}
      .history-item[open]{border-color:var(--selected-border);background:var(--selected-surface);box-shadow:none}
      .history-summary{
        display:grid;grid-template-columns:1.25fr repeat(5,.72fr) auto;gap:12px;align-items:center;
        padding:13px 14px;cursor:pointer;list-style:none;background:#0c1118;
      }
      .history-overall{display:grid;grid-template-columns:1.25fr repeat(5,.72fr) auto;gap:12px;align-items:center;padding:16px 14px;margin-bottom:18px;border:1px solid #263141;border-radius:7px;background:#101722}
      .history-total .label{font-size:10px;line-height:1.5;margin-bottom:8px}
      .history-total strong{font-size:21px;font-variant-numeric:tabular-nums}
      .history-overall .history-chevron{visibility:hidden}

    <script id="ibkr-connection-helpers">
      function ibkrDataStatus(connection) {
        if (!connection.reachable) return connection.data ? "stale" : connection.loading ? "connecting" : "disconnected";
        return connection.data?.dataStatus || "synchronizing";
      }
      function ibkrStatusLabel(connection) {
        return { connecting: "Connessione...", synchronizing: "Sincronizzazione...", current: "Dati aggiornati", stale: "Dati non aggiornati", disconnected: "Offline" }[ibkrDataStatus(connection)] || "Stato non disponibile";
      }
      function createIbkrPoller({ baseUrl, mode, onState, fetchImpl = fetch, timeoutMs = 8000, intervalMs = 5000 }) {
        let stopped = false;
        let pending = null;
        let controller = null;
        let timer = null;
        function refresh() {
          if (stopped) return Promise.resolve();
          if (pending) return pending;
          clearTimeout(timer);
          onState(current => ({ ...current, loading: true }));
          controller = new AbortController();
          const signal = controller.signal;
          const timeout = setTimeout(() => controller?.abort(), timeoutMs);
          pending = (async () => {
            try {
              const response = await fetchImpl(`${baseUrl}/api/${mode}/snapshot`, { cache: "no-store", signal });
              if (!response.ok) throw new Error(`Servizio locale non disponibile (${response.status})`);
              const data = await response.json();
              if (!data || !["connecting", "synchronizing", "current", "stale", "disconnected"].includes(data.dataStatus)) throw new Error("Aggiorna il bridge: stato dati non disponibile");
              if (!stopped && !signal.aborted) onState({ reachable: true, loading: false, data, error: "" });
            } catch (error) {
              if (!stopped) onState(current => ({ ...current, reachable: false, loading: false, error: signal.aborted ? "Tempo di risposta del bridge scaduto" : error.message }));
            } finally {
              clearTimeout(timeout);
              controller = null;
              pending = null;
              if (!stopped) timer = setTimeout(refresh, intervalMs);
            }
          })();
          return pending;
        }
        return { refresh, stop() { stopped = true; clearTimeout(timer); controller?.abort(); } };
      }
    </script>

      function roundMoney(value) {
        return Math.round(((Number(value) || 0) + Number.EPSILON) * 100) / 100;
      }

      function money(value) {
        return new Intl.NumberFormat("it-IT", {
          style: "currency",
          currency: "EUR",
          minimumFractionDigits: 2,
          maximumFractionDigits: 2
        }).format(roundMoney(value));
      }

      function detailGapTone(value) {
        const gap = Number(value) || 0;
        if (Math.abs(gap) < 0.01) return "complete";
        return gap < 0 ? "over" : "pending";
      }

      function detailGapLabel(value) {
        const gap = Number(value) || 0;
        if (Math.abs(gap) < 0.01) return "Dettaglio completo";
        return gap > 0 ? `Mancano ${money(gap)}` : `Oltre target di ${money(Math.abs(gap))}`;
      }

      function detailProgress(target, detailed) {
        const safeTarget = Math.max(0, Number(target) || 0);
        const safeDetailed = Math.max(0, Number(detailed) || 0);
        if (safeTarget <= 0) return safeDetailed > 0 ? 100 : 0;
        return Math.min(100, (safeDetailed / safeTarget) * 100);
      }

      function accountMoney(value, currency = "USD") {
        const safeCurrency = /^[A-Z]{3}$/.test(String(currency || "").toUpperCase()) ? String(currency).toUpperCase() : "USD";
        return new Intl.NumberFormat("it-IT", {
          style: "currency",

          minimumFractionDigits: 2,
          maximumFractionDigits: 2

        "Italia": "Europa", "Spagna": "Europa", "Francia": "Europa", "Germania": "Europa",
        "Regno Unito": "Europa", "Svizzera": "Europa", "Paesi Bassi": "Europa",
        "Irlanda": "Europa", "Lussemburgo": "Europa", "Europa": "Europa",
        "USA": "Nord America (USA e Canada)", "Stati Uniti": "Nord America (USA e Canada)",
        "Canada": "Nord America (USA e Canada)", "Messico": "Resto dell'America",
        "Brasile": "Resto dell'America", "Argentina": "Resto dell'America",
        "Cina": "Asia", "Hong Kong": "Asia", "Giappone": "Asia", "India": "Asia",
        "Corea del Sud": "Asia", "Singapore": "Asia", "Emirati Arabi Uniti": "Asia",
        "Arabia Saudita": "Asia", "Sudafrica": "Africa", "Australia": "Oceania",
        "Nuova Zelanda": "Oceania", "Globale": "Globale", "Mercati Emergenti": "Globale",
        "Altro": "Non classificato", "Non classificato": "Non classificato"
      };

      const countryDisplayNames = typeof Intl.DisplayNames === "function"
        ? new Intl.DisplayNames(["it"], { type: "region" })
        : null;

      function countryName(countryCode, fallback = "") {
        const normalizedCode = String(countryCode || "").trim().toUpperCase();
        if (!normalizedCode) return fallback;
        if (normalizedCode === "US") return "USA";
        if (["XS", "EU", "UN"].includes(normalizedCode)) return "Globale";
        try {
          return countryDisplayNames?.of(normalizedCode) || fallback || normalizedCode;
        } catch {
          return fallback || normalizedCode;
        }
      }

      function continentForCountry(country) {
        return continentByCountry[country] || "Non classificato";
      }

      function fallbackInvestmentType(position) {
        if (position.assetClass) return position.assetClass;
        const mapping = {
          STK: "Azioni", OPT: "Opzioni", FUT: "Derivati", FOP: "Derivati",
          CASH: "Forex", CFD: "Derivati", BOND: "Obbligazioni", FUND: "Fondi",
          WAR: "Derivati", CMDTY: "Commodities", CRYPTO: "Crypto", BAG: "Derivati",
          IOPT: "Opzioni", CONTFUT: "Derivati", IND: "Indici"
        };
        return mapping[position.securityType] || position.securityTypeLabel || "Altro";
      }

      function assetKeyFor(item) {
        const ticker = String(item.ticker || "").trim().toUpperCase();
        if (ticker) return `ticker:${ticker}`;
        return `asset:${[item.label, item.investmentType, item.investmentDetail].map((value) => String(value || "").trim().toLowerCase()).join("|")}`;
      }

      function normalizeNote(note, index = 0) {
        const normalized = {
          ...note,
          id: note.id || `legacy-${Date.now()}-${index}`,
          category: normalizeCategory(note.category),
          amount: roundMoney(note.amount)
        };
        if (normalized.category === "Investimento" && normalized.bankTransactionId && normalized.bankRecordType === "income") normalized.category = "Disinvestimento";
        if (["Investimento", "Disinvestimento"].includes(normalized.category) && normalized.bankTransactionId) {
          normalized.managementSource = "Bancario";
          normalized.currentValue = 0;
          return normalized;
        }
        if (normalized.category === "Investimento") {
          normalized.managementSource = normalized.managementSource || (normalized.ticker ? "IBKR" : "Manuale");
          if (normalized.managementSource === "IBKR") {
            normalized.label = "Capitale versato su IBKR";
            normalized.currentValue = 0;
            normalized.investmentType = "";
            normalized.investmentDetail = "";
            normalized.ticker = "";
            normalized.purchaseDate = "";
            normalized.entryPrice = 0;
            normalized.quantity = 0;
            normalized.marketPrice = 0;
            normalized.marketCurrency = "";
            normalized.geography = "";
            normalized.continent = "";
            normalized.assetKey = "";
            return normalized;
          }
          const entryPrice = Number(normalized.entryPrice) || 0;
          const amount = Number(normalized.amount) || 0;
          normalized.quantity = Number(normalized.quantity) || (entryPrice > 0 ? amount / entryPrice : 1);
          normalized.marketPrice = Number(normalized.marketPrice) || entryPrice || amount;
          normalized.currentValue = Math.max(0, numberOrFallback(normalized.currentValue, amount));
          normalized.marketCurrency = normalized.marketCurrency || "EUR";
          normalized.geography = normalized.geography || "Globale";
          normalized.continent = normalized.continent || continentForCountry(normalized.geography);
          normalized.assetKey = normalized.assetKey || assetKeyFor(normalized);
        }
        return normalized;
      }

      function summarizeNotes(notes) {
        return (notes || []).map(normalizeNote).reduce((summary, note) => {
          const amount = Math.max(0, roundMoney(note.amount));
          summary.total = roundMoney(summary.total + amount);
          if (note.category === "Costo Fisso") summary.fixedCosts = roundMoney(summary.fixedCosts + amount);
          if (note.category === "Costo Variabile") summary.variableCosts = roundMoney(summary.variableCosts + amount);
          if (note.category === "Investimento") summary.investments = roundMoney(summary.investments + amount);
          if (note.category === "Disinvestimento") summary.disinvestments = roundMoney(summary.disinvestments + amount);
          if (note.category === "Stipendio") summary.salary = roundMoney(summary.salary + amount);
          if (note.category === "Entrate aggiuntive") summary.additionalIncome = roundMoney(summary.additionalIncome + amount);
          if (note.category === "Flexible Cash") summary.flexibleCash = roundMoney(summary.flexibleCash + amount);
          return summary;
        }, { fixedCosts: 0, variableCosts: 0, investments: 0, disinvestments: 0, flexibleCash: 0, salary: 0, additionalIncome: 0, total: 0 });
      }

      function upsertDetailedIncome(current, item) {
        const previous = (current.notes || []).find(note => note.id === item.id);
        const contribution = (note, category) => note?.category === category ? Math.max(0, roundMoney(note.amount)) : 0;
        return {
          ...current,
          income: roundMoney(Math.max(0, (Number(current.income) || 0) - contribution(previous, "Stipendio") + contribution(item, "Stipendio"))).toFixed(2),
          additionalIncome: roundMoney(Math.max(0, (Number(current.additionalIncome) || 0) - contribution(previous, "Entrate aggiuntive") + contribution(item, "Entrate aggiuntive"))).toFixed(2),
          notes: previous ? current.notes.map(note => note.id === item.id ? item : note) : [...(current.notes || []), item]
        };
      }

      function detailedEntriesForCategory(notes, category) {
        return (notes || []).map((item, index) => ({ item, index })).filter(({ item }) => item.category === category);
      }

      function monthlyCashflow(inputs, details) {
        const investments = details.investments;
        const disinvestments = details.disinvestments;
        const inflows = roundMoney(details.salary + details.additionalIncome + disinvestments);
        const outflows = roundMoney(details.fixedCosts + details.variableCosts + investments);
        return { investments, disinvestments, inflows, outflows, net: roundMoney(inflows - outflows) };
      }

      function monthlyReport(record) {
        const notes = (record.notes || []).map(normalizeNote).filter(note => !note.bankTransactionId || bankMovementMatchesPeriod(note, record));
        const categories = summarizeNotes(notes);
        const cashflow = monthlyCashflow(record, categories);
        return { notes, categories, ...cashflow, netInvestments: roundMoney(categories.investments - categories.disinvestments) };
      }

      function groupReportNotes(notes) {
        const groups = new Map();
        for (const note of notes || []) {
          const label = String(note.label || "").trim().replace(/\s+/g, " ");
          const key = JSON.stringify([note.category, label.toLocaleLowerCase("it-IT")]);
          const group = groups.get(key);
          if (group) {
            group.amount = roundMoney(group.amount + roundMoney(note.amount));
            group.count += 1;
          } else groups.set(key, { ...note, label, amount: roundMoney(note.amount), count: 1, groupKey: key });
        }
        return [...groups.values()].sort((left, right) => (
          roundMoney(right.amount) - roundMoney(left.amount)
          || String(left.label).localeCompare(String(right.label), "it-IT", { sensitivity: "base" })
        ));
      }

      function aggregateMonthlyReports(records) {
        return records.reduce((total, record) => {
          const report = monthlyReport(record);
          for (const field of ["inflows", "outflows", "net", "netInvestments"]) total[field] = roundMoney(total[field] + report[field]);
          total.emergencyFund = roundMoney(total.emergencyFund + roundMoney(record.emergencyFundAllocation));
          return total;
        }, { inflows: 0, outflows: 0, net: 0, netInvestments: 0, emergencyFund: 0 });
      }

      function cashAccountBalance(current) {
        const periods = new Map();
        const periodNumber = record => Number(record.year) * 12 + months.indexOf(record.monthName);
        const selected = periodNumber(current);
        for (const record of current.monthlyHistory || []) periods.set(monthPeriodKey(record.monthName, record.year), record);
        for (const [key, draft] of Object.entries(current.monthDrafts || {})) {
          const [year, name] = key.split("-");
          periods.set(key, { ...draft, year: Number(year), monthName: months.find(month => month.toLowerCase() === name) });
        }
        periods.set(monthPeriodKey(current.monthName, current.year), current);
        let balance = roundMoney(current.cashOpeningBalance);
        const seen = new Set();
        for (const record of periods.values()) {
          if (periodNumber(record) > selected) continue;
          for (const note of record.notes || []) {
            if (note.accountId !== "cash" || (note.bankTransactionId && !bankMovementMatchesPeriod(note, record))) continue;
            const id = note.bankTransactionId || `${monthPeriodKey(record.monthName, record.year)}:${note.id}`;
            if (seen.has(id)) continue;
            seen.add(id);
            const direction = ["Stipendio", "Entrate aggiuntive", "Disinvestimento", "Prelievo cash"].includes(note.category) ? 1 : ["Costo Fisso", "Costo Variabile", "Investimento"].includes(note.category) ? -1 : 0;
            balance = roundMoney(balance + direction * roundMoney(note.amount));
          }
        }
        return balance;
      }

      function readableBankAccountCount(data) {
        if (!data?.configured || data.authorizationRequired || !data.lastSync || data.error) return 0;
        return new Set((data.accounts || []).filter(account => account.id && account.readable !== false).map(account => account.id)).size;
      }

      function availableBankMovements(records, notes) {
        const classifiedIds = new Set((notes || []).map(note => note.bankTransactionId).filter(Boolean));
        return records.filter(record => !classifiedIds.has(record.id));
      }

      function removeDetailedEntriesFromState(current, shouldRemove) {
        const notes = [];
        let linkedFixedCosts = 0;
        let linkedVariableCosts = 0;
        let removedSalary = 0;
        let removedAdditionalIncome = 0;
        (Array.isArray(current.notes) ? current.notes : []).forEach((note, index) => {
          if (!shouldRemove(note, index)) {
            notes.push(note);
            return;
          }
          const amount = Math.max(0, Number(note.amount) || 0);
          if (note.category === "Stipendio") removedSalary += amount;
          if (note.category === "Entrate aggiuntive") removedAdditionalIncome += amount;
          if (!note.bankTransactionId) return;
          if (note.category === "Costo Fisso") linkedFixedCosts += amount;
          if (note.category === "Costo Variabile") linkedVariableCosts += amount;
        });
        return {
          ...current,
          notes,
          income: roundMoney(Math.max(0, (Number(current.income) || 0) - removedSalary)).toFixed(2),
          additionalIncome: roundMoney(Math.max(0, (Number(current.additionalIncome) || 0) - removedAdditionalIncome)).toFixed(2),
          fixedCosts: roundMoney(Math.max(0, (Number(current.fixedCosts) || 0) - linkedFixedCosts)).toFixed(2),
          variableCosts: roundMoney(Math.max(0, (Number(current.variableCosts) || 0) - linkedVariableCosts)).toFixed(2)
        };
      }

      function monthPeriodKey(monthName, year) {
        return `${year}-${monthName}`.toLowerCase().trim();
      }

      function bankMovementMatchesPeriod(movement, period) {
        const match = String(movement.transactionDate || movement.date || "").match(/^(\d{4})-(\d{2})-\d{2}$/);
        return Boolean(match && Number(match[1]) === Number(period.year) && Number(match[2]) === months.indexOf(period.monthName) + 1);
      }

      function repairMonthlyRecord(record, savedSnapshot = false) {
        if (!record.monthName || !record.year) return record;
        const excluded = (record.notes || []).filter(note => note.bankTransactionId && !bankMovementMatchesPeriod(note, record));
        if (!excluded.length) return record;
        const input = { ...record, income: savedSnapshot ? record.baseIncome ?? Math.max(0, Number(record.income || 0) - Number(record.additionalIncome || 0) - Number(record.decemberBonusNet || 0) - Number(record.disinvestmentIncome || 0)) : record.income };
        const ids = new Set(excluded);
        const corrected = removeDetailedEntriesFromState(input, note => ids.has(note));
        const archived = [...(record.excludedBankNotes || [])];
        excluded.forEach(note => {
          if (!archived.some(old => old.id === note.id && old.transactionDate === note.transactionDate)) archived.push(note);
        });
        const result = { ...corrected, excludedBankNotes: archived };
        if (savedSnapshot) {
          result.baseIncome = Number(corrected.income);
          result.income = roundMoney(result.baseIncome + Number(corrected.additionalIncome || 0) + Number(record.decemberBonusNet || 0));
          result.freeCash = roundMoney(result.income - Number(corrected.fixedCosts) - Number(corrected.variableCosts));
          result.currentNetWorth = roundMoney(result.freeCash - Number(record.emergencyFundAllocation || 0));
          if (Number(record.budgetModelVersion) >= 5) {
            const cashflow = monthlyCashflow(corrected, summarizeNotes(corrected.notes));
            result.income = cashflow.inflows;
            result.monthlyOutflows = cashflow.outflows;
            result.disinvestmentIncome = cashflow.disinvestments;
            result.currentNetWorth = cashflow.net;
            result.investmentAllocation = cashflow.investments;
          }
        }
        return result;
      }

      function monthInputs(source = {}, savedSnapshot = false) {
        source = repairMonthlyRecord(source, savedSnapshot);
        return {
          excludedBankNotes: source.excludedBankNotes || [],
          income: savedSnapshot ? source.baseIncome ?? Math.max(0, Number(source.income || 0) - Number(source.decemberBonusNet || 0) - Number(source.additionalIncome || 0) - Number(source.disinvestmentIncome || 0)) : source.income ?? "0.00",
          additionalIncome: source.additionalIncome ?? "0.00",
          decemberBonusNet: source.decemberBonusNet ?? 0,
          fixedCosts: source.fixedCosts ?? "0.00",
          variableCosts: source.variableCosts ?? "0.00",
          emergencyFundAllocation: source.emergencyFundAllocation ?? 0,
          investedCapital: (savedSnapshot ? source.investmentAllocation ?? source.investedCapital : source.investedCapital) ?? 0,
          flexibleCashFunds: (savedSnapshot ? source.flexibleCashAllocation : source.flexibleCashFunds) ?? 0,
          notes: (source.notes || []).map(normalizeNote)
        };
      }

      function switchMonthlyPeriod(current, monthName, year, draftEntry) {
        const fromId = monthPeriodKey(current.monthName, current.year);
        const toId = monthPeriodKey(monthName, year);
        if (fromId === toId) return current;
        const monthDrafts = { ...(current.monthDrafts || {}), [fromId]: { ...monthInputs(current), entry: draftEntry } };
        const draft = monthDrafts[toId];
        const saved = (current.monthlyHistory || []).find(month => monthPeriodKey(month.monthName, month.year) === toId);
        const inputs = draft ? monthInputs({ ...draft, monthName, year }) : monthInputs(saved, Boolean(saved));
        return { ...current, ...inputs, monthName, year, monthDrafts };
      }

      function mergeValueMaps(...maps) {
        return maps.reduce((merged, values) => {
          Object.entries(values || {}).forEach(([label, value]) => {
            merged[label] = (merged[label] || 0) + Math.max(0, Number(value) || 0);
          });
          return merged;
        }, {});
      }

      const months = [
        "Gennaio", "Febbraio", "Marzo", "Aprile", "Maggio", "Giugno",
        "Luglio", "Agosto", "Settembre", "Ottobre", "Novembre", "Dicembre"
      ];

      const investmentTypes = [
        "Liquidita'",
        "Titoli di Stato",
        "Azioni",
        "Obbligazioni",
        "Crypto",
        "Derivati",
        "Real Estate",
        "ETF",
        "Fondi",
        "Indici",
        "Opzioni",
        "Commodities",
        "Forex",
        "Equity",
        "Passion Assets"
      ];

      const riskWeights = [
        { match: "titoli di stato", label: "Titoli di Stato", weight: 12 },
        { match: "obblig", label: "Obbligazioni corporate / altre", weight: 30 },
        { match: "liquid", label: "Liquidità", weight: 5 },
        { match: "real estate", label: "Real Estate / REIT", weight: 45 },
        { match: "fond", label: "Fondi", weight: 50 },
        { match: "etf", label: "ETF", weight: 55 },
        { match: "indic", label: "Indici", weight: 60 },
        { match: "commod", label: "Commodities", weight: 65 },
        { match: "azion", label: "Azioni", weight: 70 },
        { match: "equity", label: "Equity", weight: 70 },
        { match: "passion", label: "Passion Assets", weight: 70 },
        { match: "forex", label: "Forex", weight: 75 },
        { match: "crypto", label: "Crypto", weight: 95 },
        { match: "opzion", label: "Opzioni", weight: 100 },
        { match: "derivat", label: "Derivati", weight: 100 }
      ];

      function riskWeightForType(type) {
        const normalizedType = String(type || "").trim().toLowerCase();
        return riskWeights.find((item) => normalizedType.includes(item.match))?.weight ?? 60;
      }

      const geographies = [
        "Globale", "Italia", "USA", "Spagna", "Francia", "Germania", "Regno Unito",
        "Svizzera", "Paesi Bassi", "Irlanda", "Lussemburgo", "Canada", "Messico",
        "Brasile", "Argentina", "Cina", "Hong Kong", "Giappone", "India", "Corea del Sud",
        "Singapore", "Australia", "Nuova Zelanda", "Sudafrica", "Emirati Arabi Uniti",
        "Arabia Saudita", "Europa", "Mercati Emergenti", "Altro", "Non classificato"
      ];

      const continents = [
        "Globale", "Europa", "Nord America (USA e Canada)", "Resto dell'America",
        "Asia", "Africa", "Oceania", "Antartide", "Non classificato"
      ];

      const wealthColors = ["#74d4f5", "#8876ff", "#59e49a", "#ffca5b", "#ff858b", "#4ba8ff", "#c58cff", "#5fd1c8", "#e9a85d", "#9cb0c9"];

      function buildDonutGradient(entries) {
        const total = entries.reduce((sum, item) => sum + Number(item.value || 0), 0);
        if (total <= 0) return "conic-gradient(#202a38 0 100%)";
        let cursor = 0;
        const stops = entries.map((item, index) => {
          const start = cursor;
          cursor += (Number(item.value || 0) / total) * 100;
          return `${wealthColors[index % wealthColors.length]} ${start}% ${cursor}%`;
        });
        return `conic-gradient(${stops.join(", ")})`;
      }

      function nextMonth(monthName, year) {
        const index = months.findIndex((month) => month.toLowerCase() === String(monthName).toLowerCase());
        const currentIndex = index >= 0 ? index : 0;
        const nextIndex = (currentIndex + 1) % months.length;
        return {
          monthName: months[nextIndex],
          year: nextIndex === 0 ? (Number(year) || 2026) + 1 : Number(year) || 2026
        };
      }

      function sortMonthlyHistory(history) {
        return [...(history || [])].sort((a, b) => {
          const yearDelta = (Number(a.year) || 0) - (Number(b.year) || 0);
          if (yearDelta !== 0) return yearDelta;
          const aMonth = months.findIndex((month) => month === a.monthName);
          const bMonth = months.findIndex((month) => month === b.monthName);
          return aMonth - bMonth;
        });
      }

      function recalibrateMonthlyHistory(history) {
        let cumulativeEmergencyFund = 0;
        let cumulativeFlexibleCash = 0;
        let cumulativeManualPortfolioValue = 0;
        return sortMonthlyHistory(history).map((storedMonth) => {
          const month = repairMonthlyRecord(storedMonth, true);
          const normalizedNotes = (month.notes || []).map(normalizeNote);
          const noteTotals = summarizeNotes(normalizedNotes);
          const monthModelVersion = Number(month.budgetModelVersion || 0);
          const usesMacroTargets = monthModelVersion >= 4;
          const legacyBaseFixedCosts = Math.max(0, Number(month.baseFixedCosts ?? (Number(month.fixedCosts || 0) - noteTotals.fixedCosts)) || 0);
          const legacyBaseVariableCosts = Math.max(0, Number(month.baseVariableCosts ?? (Number(month.variableCosts || 0) - noteTotals.variableCosts)) || 0);
          const legacyUnclassifiedInvestments = Math.max(0, Number(month.unclassifiedInvestmentAllocation ?? (Number(month.investmentAllocation ?? month.investedCapital ?? 0) - noteTotals.investments)) || 0);
          const fixedCosts = usesMacroTargets
            ? Math.max(0, numberOrFallback(month.fixedCosts, legacyBaseFixedCosts + noteTotals.fixedCosts))
            : legacyBaseFixedCosts + noteTotals.fixedCosts;
          const variableCosts = usesMacroTargets
            ? Math.max(0, numberOrFallback(month.variableCosts, legacyBaseVariableCosts + noteTotals.variableCosts))
            : legacyBaseVariableCosts + noteTotals.variableCosts;
          const investmentAllocation = usesMacroTargets
            ? Math.max(0, numberOrFallback(month.investmentAllocation ?? month.investedCapital, legacyUnclassifiedInvestments + noteTotals.investments))
            : legacyUnclassifiedInvestments + noteTotals.investments;
          const availableAfterEmergency = Number(month.currentNetWorth ?? ((Number(month.freeCash) || 0) - (Number(month.emergencyFundAllocation) || 0))) || 0;
          const legacyFlexibleCash = Math.max(0, numberOrFallback(month.flexibleCashAllocation, availableAfterEmergency - investmentAllocation));
          const legacyBaseFlexibleCash = Math.max(0, numberOrFallback(month.baseFlexibleCashAllocation, legacyFlexibleCash - noteTotals.flexibleCash));
          const flexibleCashAllocation = usesMacroTargets
            ? Math.max(0, numberOrFallback(month.flexibleCashAllocation, legacyFlexibleCash))
            : legacyBaseFlexibleCash + noteTotals.flexibleCash;
          const fixedCostDetailGap = fixedCosts - noteTotals.fixedCosts;
          const variableCostDetailGap = variableCosts - noteTotals.variableCosts;
          const investmentDetailGap = investmentAllocation - noteTotals.investments;
          const flexibleCashDetailGap = flexibleCashAllocation - noteTotals.flexibleCash;
          const baseFixedCosts = Math.max(0, fixedCostDetailGap);
          const baseVariableCosts = Math.max(0, variableCostDetailGap);
          const unclassifiedInvestmentAllocation = Math.max(0, investmentDetailGap);
          const baseFlexibleCashAllocation = Math.max(0, flexibleCashDetailGap);
          const manualInvestmentValue = normalizedNotes
            .filter((note) => note.category === "Investimento" && note.managementSource === "Manuale")
            .reduce((sum, note) => sum + Math.max(0, numberOrFallback(note.currentValue, note.amount)), 0);
          cumulativeEmergencyFund = roundMoney(cumulativeEmergencyFund + roundMoney(month.emergencyFundAllocation));
          cumulativeFlexibleCash += flexibleCashAllocation;
          cumulativeManualPortfolioValue += manualInvestmentValue;
          const savedPortfolioValue = Number(month.portfolioMarketValue) || 0;
          const legacyEmergencyFund = Math.max(0, Number(month.projectedEmergencyFund) || cumulativeEmergencyFund);
          const legacyCumulativeFlexibleCash = Math.max(0, Number(month.cumulativeFlexibleCash) || cumulativeFlexibleCash);
          const storedIbkrCash = Number(month.ibkrCash);
          const inferredIbkrCash = Math.max(0, (Number(month.liquidityAvailable) || 0) - legacyEmergencyFund - legacyCumulativeFlexibleCash);
          const ibkrCash = Number.isFinite(storedIbkrCash) ? Math.max(0, storedIbkrCash) : inferredIbkrCash;
          return {
            ...month,
            budgetModelVersion: 4,
            notes: normalizedNotes,
            baseFixedCosts,
            baseVariableCosts,
            fixedCosts,
            variableCosts,
            unclassifiedInvestmentAllocation,
            investmentAllocation,
            investedCapital: investmentAllocation,
            baseFlexibleCashAllocation,
            flexibleCashAllocation,
            fixedCostDetailGap,
            variableCostDetailGap,
            investmentDetailGap,
            flexibleCashDetailGap,
            allocatedCapital: investmentAllocation + flexibleCashAllocation,
            unallocatedCapital: availableAfterEmergency - investmentAllocation - flexibleCashAllocation,
            manualInvestmentValue,
            cumulativeManualPortfolioValue,
            ibkrCash,
            projectedEmergencyFund: cumulativeEmergencyFund,
            cumulativeEmergencyFund,
            cumulativeFlexibleCash,
            wealthTotal: savedPortfolioValue + cumulativeEmergencyFund + cumulativeFlexibleCash + cumulativeManualPortfolioValue,
            liquidityAvailable: ibkrCash + cumulativeEmergencyFund + cumulativeFlexibleCash
          };
        });
      }

      function normalizeStoredState(parsed) {
        if (!parsed || typeof parsed !== "object" || Array.isArray(parsed)) throw new Error("Archivio dati non valido");
        parsed = repairMonthlyRecord(parsed);
        const savedState = { ...parsed };
        savedState.monthDrafts = Object.fromEntries(Object.entries(parsed.monthDrafts || {}).map(([key, draft]) => {
          const [year, name] = key.split("-");
          const monthName = months.find(month => month.toLowerCase() === name);
          return [key, repairMonthlyRecord({ ...draft, monthName, year: Number(year) })];
        }));
        delete savedState.pendingSales;
        delete savedState.marketQuotes;
        const normalizedCurrentNotes = (parsed.notes || defaultState.notes).map(normalizeNote);
        const currentNoteTotals = summarizeNotes(normalizedCurrentNotes);
        const budgetModelVersion = Number(parsed.budgetModelVersion || 0);
        const usesMacroTargets = budgetModelVersion >= 4;
        const usesAdditiveDetails = budgetModelVersion >= 2 && budgetModelVersion < 4;
        savedState.fixedCosts = Math.max(0, Number(parsed.fixedCosts) || 0) + (usesAdditiveDetails ? currentNoteTotals.fixedCosts : 0);
        savedState.variableCosts = Math.max(0, Number(parsed.variableCosts) || 0) + (usesAdditiveDetails ? currentNoteTotals.variableCosts : 0);
        savedState.investedCapital = Math.max(0, Number(parsed.investedCapital) || 0) + (usesAdditiveDetails ? currentNoteTotals.investments : 0);
        const isDecember = String(parsed.monthName || defaultState.monthName).toLowerCase() === "dicembre";
        const currentIncome = (Number(parsed.income) || 0) + (Number(parsed.additionalIncome) || 0) + (isDecember ? Math.min(2000, Math.max(0, Number(parsed.decemberBonusNet) || 0)) : 0);
        const currentAvailableAfterEmergency = currentIncome
          - savedState.fixedCosts
          - savedState.variableCosts
          - roundMoney(parsed.emergencyFundAllocation);
        const currentInvestmentAllocation = savedState.investedCapital;
        const inferredFlexibleCash = Math.max(0, currentAvailableAfterEmergency - currentInvestmentAllocation);
        savedState.flexibleCashFunds = usesMacroTargets
          ? Math.max(0, Number(parsed.flexibleCashFunds) || 0)
          : budgetModelVersion >= 3
            ? Math.max(0, Number(parsed.flexibleCashFunds) || 0) + currentNoteTotals.flexibleCash
            : inferredFlexibleCash;
        savedState.budgetModelVersion = 4;
        const monthlyHistory = recalibrateMonthlyHistory((parsed.monthlyHistory || []).map((month) => {
          const savedMonth = { ...month };
          delete savedMonth.sales;
          return {
            ...savedMonth,
            notes: (month.notes || []).map(normalizeNote)
          };
        }));
        return {
          ...defaultState,
          ...savedState,
          notes: normalizedCurrentNotes,
          monthlyHistory
        };
      }

      function App() {
        const [state, setState] = useState(loadState);
        const [isFinanceSectionOpen, setIsFinanceSectionOpen] = useState(() => localStorage.getItem("finance-section-open") !== "false");
        const [isWealthSectionOpen, setIsWealthSectionOpen] = useState(() => localStorage.getItem("wealth-section-open") !== "false");
        const [isMonthlyInputOpen, setIsMonthlyInputOpen] = useState(() => localStorage.getItem("monthly-input-panel-open") !== "false");
        const [isMonthlyHistoryOpen, setIsMonthlyHistoryOpen] = useState(() => localStorage.getItem("monthly-history-panel-open") !== "false");
        const [isPortfolioPanelOpen, setIsPortfolioPanelOpen] = useState(() => localStorage.getItem("portfolio-panel-open") !== "false");
        const [entry, setEntry] = useState(createEmptyEntry);
        const [yearInput, setYearInput] = useState(() => state.year);
        useEffect(() => setYearInput(state.year), [state.year]);
        const [editingMonthId, setEditingMonthId] = useState("");
        const [persistenceStatus, setPersistenceStatus] = useState("loading");
        const persistenceReady = useRef(false);
        const persistenceQueue = useRef(Promise.resolve());
        const persistenceTimer = useRef(null);
        const ibkrPollers = useRef({});
        const [ibkrPaper, setIbkrPaper] = useState({ reachable: false, loading: true, data: null, error: "" });
        const [ibkrLive, setIbkrLive] = useState({ reachable: false, loading: true, data: null, error: "" });
        const [banking, setBanking] = useState({ loading: true, busy: false, data: null, error: "" });
        const [bankSetup, setBankSetup] = useState({ applicationId: "", country: "IT", bank: "", validDays: 90 });
        const [bankOptions, setBankOptions] = useState([]);
        const [bankSetupMessage, setBankSetupMessage] = useState("");
        const bankKeyFile = useRef(null);
        const [bankRename, setBankRename] = useState({ id: "", value: "" });
        useEffect(() => {
          localStorage.setItem(storageKey, JSON.stringify(state));
        }, [state]);

        useEffect(() => {
          let cancelled = false;
          (async () => {
            try {
              const response = await fetch(`${ibkrBridgeBaseUrl}/api/state`, { cache: "no-store" });
              const document = await response.json().catch(() => ({}));
              if (!response.ok) throw new Error(document.error || "Memoria locale non disponibile");
              if (!cancelled && document.saved && document.state) {
                setState(normalizeStoredState(document.state));
                setEntry({ ...createEmptyEntry(), ...(document.entry || {}), category: document.entry?.category === "Flexible Cash" ? "Costo Variabile" : document.entry?.category || "Costo Variabile" });
                setEditingMonthId(String(document.editingMonthId || ""));
                const ui = document.ui || {};
                if (typeof ui.financeSectionOpen === "boolean") setIsFinanceSectionOpen(ui.financeSectionOpen);
                if (typeof ui.wealthSectionOpen === "boolean") setIsWealthSectionOpen(ui.wealthSectionOpen);
                if (typeof ui.monthlyInputOpen === "boolean") setIsMonthlyInputOpen(ui.monthlyInputOpen);
                if (typeof ui.monthlyHistoryOpen === "boolean") setIsMonthlyHistoryOpen(ui.monthlyHistoryOpen);
                if (typeof ui.portfolioPanelOpen === "boolean") setIsPortfolioPanelOpen(ui.portfolioPanelOpen);
              } else if (!cancelled) {
                const initialPayload = {
                  _csrf: csrfToken,
                  state: {
                    ...state,
                    budgetModelVersion: 4,
                    notes: (state.notes || []).map(normalizeNote),
                    monthlyHistory: recalibrateMonthlyHistory(state.monthlyHistory || [])
                  },
                  entry,
                  editingMonthId,
                  ui: {
                    financeSectionOpen: isFinanceSectionOpen,
                    wealthSectionOpen: isWealthSectionOpen,
                    monthlyInputOpen: isMonthlyInputOpen,
                    monthlyHistoryOpen: isMonthlyHistoryOpen,
                    portfolioPanelOpen: isPortfolioPanelOpen
                  }
                };
                const saveResponse = await fetch(`${ibkrBridgeBaseUrl}/api/state`, {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify(initialPayload)
                });
                if (!saveResponse.ok) throw new Error("Inizializzazione memoria non riuscita");
              }
              if (!cancelled) {
                persistenceReady.current = true;
                setPersistenceStatus("saved");
              }
            } catch {
              if (!cancelled) {
                persistenceReady.current = false;
                setPersistenceStatus("error");
              }
            }
          })();
          return () => { cancelled = true; };
        }, []);

        const persistencePayload = useMemo(() => ({
          _csrf: csrfToken,
          state: {
            ...state,
            budgetModelVersion: 4,
            notes: (state.notes || []).map(normalizeNote),
            monthlyHistory: recalibrateMonthlyHistory(state.monthlyHistory || [])
          },
          entry,
          editingMonthId,
          ui: {
            financeSectionOpen: isFinanceSectionOpen,
            wealthSectionOpen: isWealthSectionOpen,
            monthlyInputOpen: isMonthlyInputOpen,
            monthlyHistoryOpen: isMonthlyHistoryOpen,
            portfolioPanelOpen: isPortfolioPanelOpen
          }
        }), [state, entry, editingMonthId, isFinanceSectionOpen, isWealthSectionOpen, isMonthlyInputOpen, isMonthlyHistoryOpen, isPortfolioPanelOpen]);

        const queueStateSave = (payload) => {
          persistenceQueue.current = persistenceQueue.current.catch(() => {}).then(async () => {
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), 8000);
            try {
              const response = await fetch(`${ibkrBridgeBaseUrl}/api/state`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload),
                signal: controller.signal
              });
              if (!response.ok) throw new Error("Salvataggio non riuscito");
            } finally {
              clearTimeout(timeout);
            }
          });
          return persistenceQueue.current;
        };

        useEffect(() => {
          window.dashboardFlushState = async () => {
            clearTimeout(persistenceTimer.current);
            if (!persistenceReady.current) return false;
            try {
              await queueStateSave(persistencePayload);
              setPersistenceStatus("saved");
              return true;
            } catch {
              setPersistenceStatus("error");
              return false;
            }
          };
          return () => { delete window.dashboardFlushState; };
        }, [persistencePayload]);

        useEffect(() => {
          if (!persistenceReady.current) return;
          setPersistenceStatus("saving");
          persistenceTimer.current = setTimeout(() => {
            queueStateSave(persistencePayload).then(
              () => setPersistenceStatus("saved"),
              () => setPersistenceStatus("error")
            );
          }, 350);
          return () => clearTimeout(persistenceTimer.current);
        }, [persistencePayload]);

        useEffect(() => {
          const flushState = () => {
            if (!persistenceReady.current) return;
            navigator.sendBeacon(
              `${ibkrBridgeBaseUrl}/api/state`,
              new Blob([JSON.stringify(persistencePayload)], { type: "application/json" })
            );
          };
          const flushWhenHidden = () => {
            if (document.visibilityState === "hidden") flushState();
          };
          window.addEventListener("pagehide", flushState);
          document.addEventListener("visibilitychange", flushWhenHidden);
          return () => {
            window.removeEventListener("pagehide", flushState);
            document.removeEventListener("visibilitychange", flushWhenHidden);
          };
        }, [persistencePayload]);

        useEffect(() => {
          localStorage.setItem("finance-section-open", String(isFinanceSectionOpen));
        }, [isFinanceSectionOpen]);

        useEffect(() => {
          localStorage.setItem("wealth-section-open", String(isWealthSectionOpen));
        }, [isWealthSectionOpen]);

        useEffect(() => {
          localStorage.setItem("monthly-input-panel-open", String(isMonthlyInputOpen));
        }, [isMonthlyInputOpen]);

        useEffect(() => {
          localStorage.setItem("monthly-history-panel-open", String(isMonthlyHistoryOpen));
        }, [isMonthlyHistoryOpen]);

        useEffect(() => {
          localStorage.setItem("portfolio-panel-open", String(isPortfolioPanelOpen));
        }, [isPortfolioPanelOpen]);

        useEffect(() => {
          const pollers = {
            paper: createIbkrPoller({ baseUrl: ibkrBridgeBaseUrl, mode: "paper", onState: setIbkrPaper }),
            live: createIbkrPoller({ baseUrl: ibkrBridgeBaseUrl, mode: "live", onState: setIbkrLive })
          };
          ibkrPollers.current = pollers;
          Object.values(pollers).forEach(poller => poller.refresh());
          return () => Object.values(pollers).forEach(poller => poller.stop());
        }, []);

        async function refreshBanking() {
          try {
            const response = await fetch(`${ibkrBridgeBaseUrl}/api/enable-banking/snapshot`, { cache: "no-store" });
            const data = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(data.error || "Collegamento bancario non disponibile");
            setBanking(current => ({ ...current, loading: false, data, error: data.error || "" }));
          } catch (error) {
            setBanking(current => ({ ...current, loading: false, error: error.message }));
          }
        }

        async function bankingControl(action, extra = {}) {
          setBanking(current => ({ ...current, busy: true, error: "" }));
          try {
            const response = await fetch(`${ibkrBridgeBaseUrl}/api/enable-banking/control`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ _csrf: csrfToken, action, ...extra })
            });
            const data = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(data.error || "Operazione bancaria non riuscita");
            if (data.url) {
              window.location.assign(data.url);
              await refreshBanking();
            }
            else if (!data.banks) setBanking(current => ({ ...current, busy: false, data, error: data.error || "" }));
            if (!data.url) await refreshBanking();
            return data;
          } catch (error) {
            setBanking(current => ({ ...current, busy: false, error: error.message }));
            return null;
          } finally {
            setBanking(current => ({ ...current, busy: false }));
          }
        }

        useEffect(() => {
          refreshBanking();
          const timer = setInterval(refreshBanking, 30000);
          return () => clearInterval(timer);
        }, []);

        useEffect(() => {
          if (!banking.data?.authorizationPending) return undefined;
          const timer = setInterval(refreshBanking, 1500);
          return () => clearInterval(timer);
        }, [banking.data?.authorizationPending]);

        async function configureBanking() {
          const file = bankKeyFile.current?.files?.[0];
          if (!bankSetup.applicationId.trim() || !file) {
            setBanking(current => ({ ...current, error: "Inserisci l’Application ID e seleziona la chiave privata PEM." }));
            return;
          }
          if (file.size > 20000) {
            setBanking(current => ({ ...current, error: "La chiave selezionata è troppo grande." }));
            return;
          }
          const privateKey = await file.text();
          const configured = await bankingControl("configure", { applicationId: bankSetup.applicationId.trim(), privateKey });
          if (configured) {
            setBankSetupMessage("Configurazione verificata. Ora scegli la banca da collegare.");
            setBankSetup(current => ({ ...current, applicationId: "" }));
            if (bankKeyFile.current) bankKeyFile.current.value = "";
          }
        }

        async function loadBankOptions(country = bankSetup.country) {
          setBankSetupMessage("Caricamento banche disponibili...");
          const result = await bankingControl("banks", { country });
          const banks = result?.banks || [];
          setBankOptions(banks);
          setBankSetup(current => ({ ...current, country, bank: banks.some(item => item.name === current.bank) ? current.bank : (banks[0]?.name || "") }));
          setBankSetupMessage(banks.length ? `${banks.length} banche disponibili.` : "Nessuna banca disponibile per il Paese selezionato.");
        }

        useEffect(() => {
          if (banking.data?.configured && bankOptions.length === 0 && !banking.data?.authorizationPending) loadBankOptions(bankSetup.country);
        }, [banking.data?.configured]);

        function refreshIbkr(mode) {
          return ibkrPollers.current[mode]?.refresh();
        }

        const totals = useMemo(() => {
          const noteTotals = summarizeNotes(state.notes);
          const baseIncome = noteTotals.salary;
          const decemberBonusNet = 0;
          const additionalIncome = noteTotals.additionalIncome;
          const income = roundMoney(baseIncome + additionalIncome);
          const fixedCosts = noteTotals.fixedCosts;
          const variableCosts = noteTotals.variableCosts;
          const fixedCostDetailGap = fixedCosts - noteTotals.fixedCosts;
          const variableCostDetailGap = variableCosts - noteTotals.variableCosts;
          const baseFixedCosts = Math.max(0, fixedCostDetailGap);
          const baseVariableCosts = Math.max(0, variableCostDetailGap);
          const essential = fixedCosts + variableCosts;
          const freeCash = income - essential;
          const emergencyFundAllocation = roundMoney(state.emergencyFundAllocation);
          const cashflow = monthlyCashflow(state, noteTotals);
          const currentNetWorth = cashflow.net;
          const investmentAllocation = cashflow.investments;
          const flexibleCashAllocation = 0;
          const investmentDetailGap = investmentAllocation - noteTotals.investments;
          const flexibleCashDetailGap = flexibleCashAllocation - noteTotals.flexibleCash;
          const unclassifiedInvestmentAllocation = Math.max(0, investmentDetailGap);
          const baseFlexibleCashAllocation = Math.max(0, flexibleCashDetailGap);
          const allocatedCapital = investmentAllocation + flexibleCashAllocation;
          const investable = Math.max(0, currentNetWorth);
          const emergencyFundTarget = 6000;
          const currentPeriodId = `${state.year}-${state.monthName}`.toLowerCase().trim();
          const historicalEmergencyFund = (state.monthlyHistory || [])
            .filter((month) => month.id !== currentPeriodId && month.id !== editingMonthId)
            .reduce((sum, month) => roundMoney(sum + roundMoney(month.emergencyFundAllocation)), 0);
          const projectedEmergencyFund = roundMoney(historicalEmergencyFund + emergencyFundAllocation);
          const emergencyGap = Math.max(0, emergencyFundTarget - projectedEmergencyFund);
          const emergencyProgress = emergencyFundTarget > 0 ? Math.max(0, Math.min(100, (projectedEmergencyFund / emergencyFundTarget) * 100)) : 0;
          const spendable = currentNetWorth;
          const ratio = income > 0 ? (currentNetWorth / income) * 100 : 0;
          const unallocatedCapital = currentNetWorth;

          return {
            cashflow,
            income,
            baseIncome,
            additionalIncome,
            decemberBonusNet,
            noteTotals,
            baseFixedCosts,
            baseVariableCosts,
            fixedCosts,
            variableCosts,
            essential,
            freeCash,
            currentNetWorth,
            investable,

        function navigateMonth(monthName, year) {
          if (!months.includes(monthName) || !Number.isInteger(Number(year)) || Number(year) < 1900 || Number(year) > 9999) return;
          const id = monthPeriodKey(monthName, year);
          if (id === monthPeriodKey(state.monthName, state.year)) return;

          setEditingMonthId(saved?.id || "");

          setBankRename({ id: "", value: "" });
          setState(current => switchMonthlyPeriod(current, monthName, Number(year), entry));

          if (field === "monthName") return navigateMonth(value, state.year);

        function classifyBankExpense(expense, category) {
          if (category === "Prelievo cash") {
            if (expense.currency !== "EUR" || expense.recordType !== "expense" || !bankMovementMatchesPeriod(expense, state)) return;
            const note = normalizeNote({ id: `bank-${expense.id}`, bankTransactionId: expense.id, bank: expense.bank, transactionDate: expense.date, originalBankDescription: expense.description, bankRecordType: "expense", label: expense.customName || expense.description, amount: expense.amount, category, accountId: "cash" });
            setState(current => upsertDetailedIncome(current, note));
            return;
          }
          const allowed = expense.recordType === "income" ? ["Stipendio", "Entrate aggiuntive", "Disinvestimento"] : expense.recordType === "expense" ? ["Costo Fisso", "Costo Variabile", "Investimento"] : [];
          if (expense.currency !== "EUR" || !allowed.includes(category) || !bankMovementMatchesPeriod(expense, state)) return;
          setEntry(current => ({ ...createEmptyEntry(), category }));
          setState(current => {
            const bankNote = normalizeNote({
              id: `bank-${expense.id}`,
              bankTransactionId: expense.id,
              bank: expense.bank,
              transactionDate: expense.date,
              originalBankDescription: expense.description,
              bankRecordType: expense.recordType,
              autoImported: false,
              label: expense.customName || expense.description,
              amount: expense.amount,
              category
            });
            if (expense.recordType === "income" || category === "Investimento") return upsertDetailedIncome(current, bankNote);
            let replaced = false;
            const notes = (current.notes || []).map(note => {
              if (note.bankTransactionId !== expense.id) return note;
              replaced = true;
              return bankNote;
            });
            if (!replaced) notes.push(bankNote);
            const fixedCosts = notes.filter(note => normalizeCategory(note.category) === "Costo Fisso")
              .reduce((sum, note) => roundMoney(sum + Math.max(0, Number(note.amount) || 0)), 0);
            const variableCosts = notes.filter(note => normalizeCategory(note.category) === "Costo Variabile")
              .reduce((sum, note) => roundMoney(sum + Math.max(0, Number(note.amount) || 0)), 0);
            return { ...current, notes, fixedCosts: fixedCosts.toFixed(2), variableCosts: variableCosts.toFixed(2) };
          });
        }

        async function addEntry() {
          const isInvestment = entry.category === "Investimento";
          const isIbkrInvestment = isInvestment && entry.managementSource === "IBKR";
          if ((!isIbkrInvestment && !entry.label.trim()) || !entry.amount) return;
          if (entry.bankTransactionId) {
            const renamed = await bankingControl("rename", { recordId: entry.bankTransactionId, customName: entry.label.trim() });
            if (!renamed) return;
          }
          const isManualInvestment = isInvestment && entry.managementSource === "Manuale";
          const entryPrice = Number(entry.entryPrice) || 0;
          const amount = roundMoney(entry.amount);
          const quantity = Number(entry.quantity) || (entryPrice > 0 ? amount / entryPrice : 1);
          const item = normalizeNote({
            id: entry.id || `${Date.now()}-${Math.random().toString(16).slice(2)}`,
            label: isIbkrInvestment ? "Capitale versato su IBKR" : entry.label.trim(),
            amount,
            accountId: entry.bankTransactionId ? undefined : "cash",

            marketCurrency: isManualInvestment ? entry.marketCurrency : "",
            geography: isManualInvestment ? entry.geography : "",
            continent: isManualInvestment ? entry.continent : ""

          setState(current => upsertDetailedIncome(current, item));
          setEntry({ ...createEmptyEntry(), category: entry.category });

        const emergencyProgressValue = Math.min(100, Math.max(0, Number(totals.emergencyProgress) || 0));
        const emergencyHue = emergencyProgressValue <= 50
          ? (emergencyProgressValue / 50) * 50
          : 50 + ((emergencyProgressValue - 50) / 50) * 82;
        const emergencyStatusStyle = {
          "--emergency-color": `hsl(${emergencyHue} 90% 54%)`,

          "--emergency-dark": `hsl(${emergencyHue} 82% 36%)`,

          "--emergency-contrast": emergencyProgressValue >= 40 ? "#11150b" : "#ffffff"
        };
        const monthlyHistory = useMemo(() => {

        const allInvestmentNotes = useMemo(() => {
          return monthlyHistory.flatMap((month) => (month.notes || [])

        }, [monthlyHistory]);
        const manualPortfolio = useMemo(() => {
          const positions = allInvestmentNotes
            .filter((note) => note.managementSource === "Manuale")
            .map((note) => {
              const costBasis = Math.max(0, Number(note.amount) || 0);

              return {
                ...note,

                currentValue,

              };
            });
          const byType = positions.reduce((totalsByType, position) => {
            const type = position.investmentType || "Altro";
            totalsByType[type] = (totalsByType[type] || 0) + position.currentValue;
            return totalsByType;
          }, {});
          const geographicPositions = positions.filter((position) => !String(position.investmentType || "").toLowerCase().includes("liquid"));
          const byContinent = geographicPositions.reduce((totalsByContinent, position) => {

            return totalsByContinent;

          const byCountry = geographicPositions.reduce((totalsByCountry, position) => {

          const byCurrency = positions.reduce((totalsByCurrency, position) => {

            totalsByCurrency[currency] = (totalsByCurrency[currency] || 0) + position.currentValue;
            return totalsByCurrency;
          }, {});
          const total = positions.reduce((sum, position) => sum + position.currentValue, 0);
          const costBasis = positions.reduce((sum, position) => sum + position.costBasis, 0);
          const liquidValue = positions

          return {

        }, [allInvestmentNotes]);
        const liveData = ibkrLive.data;
        const liveMetrics = liveData?.metrics || {};
        const liveCurrency = liveData?.baseCurrency || "EUR";
        const liveConnected = ibkrDataStatus(ibkrLive) === "current";
        const liveContractMetadataReady = Number(liveData?.contractMetadataVersion || 0) >= 1;
        const livePortfolio = useMemo(() => {

          const preparedPositions = sourcePositions.map((position) => {
            const ibkrCountry = countryName(position.issuerCountryCode, position.issuerCountry || "");
            const country = ibkrCountry || "Non classificato";
            const continent = position.issuerContinent || continentForCountry(country);
            const nativeMarketValue = Number(position.marketValue) || 0;
            const quantity = Number(position.quantity) || 0;
            const marketPrice = Number(position.marketPrice) || 0;
            const averageCost = Number(position.averageCost) || 0;
            const rawExposure = Math.abs(nativeMarketValue || (quantity * marketPrice) || (quantity * averageCost));
            return {

          const grossPositionValue = apiGrossExposure || rawGrossExposure;
          const exposureScale = rawGrossExposure > 0 && apiGrossExposure > 0 ? apiGrossExposure / rawGrossExposure : 1;
          const positions = preparedPositions.map((position) => ({
            ...position,

          }));
          const investmentPositions = positions.filter((position) => position.securityType !== "CASH");
          const geographicPositions = positions.filter((position) => position.geographyEligible);
          const byType = investmentPositions.reduce((totalsByType, position) => {

          const byContinent = geographicPositions.reduce((totalsByContinent, position) => {
